<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔥 Almohet - Firebase Exploiter</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}body{background:#0a0a14;color:#e2e8f0;min-height:100vh;padding:16px}.container{max-width:1400px;margin:0 auto}.header{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;padding:20px 28px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header .subtitle{color:#94a3b8;font-size:13px}.badge-connected{background:rgba(34,197,94,.15);color:#4ade80;padding:6px 16px;border-radius:20px;border:1px solid rgba(34,197,94,.3)}.badge-error{background:rgba(239,68,68,.15);color:#f87171;padding:6px 16px;border-radius:20px;border:1px solid rgba(239,68,68,.3)}.badge-warn{background:rgba(249,115,22,.15);color:#fb923c;padding:6px 16px;border-radius:20px;border:1px solid rgba(249,115,22,.3)}.controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.btn{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:#f97316;color:#fff}.btn-primary:hover{background:#ea580c;transform:translateY(-2px)}.btn-success{background:#22c55e;color:#fff}.btn-success:hover{background:#16a34a;transform:translateY(-2px)}.btn-secondary{background:rgba(255,255,255,.08);color:#e2e8f0}.btn-secondary:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:4px}.tab-btn{padding:10px 18px;border:none;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;background:transparent;color:#94a3b8}.tab-btn.active{background:rgba(249,115,22,.15);color:#f97316;border-bottom:2px solid #f97316}.tab-btn:hover:not(.active){color:#fff;background:rgba(255,255,255,.05)}.panel{display:none}.panel.active{display:block}.table-wrapper{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;overflow:hidden;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}thead{background:rgba(255,255,255,.04)}th{padding:12px 14px;text-align:right;font-weight:600;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.5px}td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;word-break:break-word;font-size:13px}tr:hover td{background:rgba(255,255,255,.02)}.badge{display:inline-block;padding:2px 12px;border-radius:12px;font-size:11px;font-weight:600}.badge-admin{background:rgba(239,68,68,.2);color:#f87171}.badge-user{background:rgba(59,130,246,.2);color:#60a5fa}.loading{text-align:center;padding:40px;color:#64748b}.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:#f97316;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;padding:40px;color:#64748b}.empty .icon{font-size:40px;margin-bottom:10px}.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;z-index:999;animation:slideUp .3s ease;max-width:450px;box-shadow:0 10px 40px rgba(0,0,0,.5)}.toast-success{background:#22c55e}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.file-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.03);flex-wrap:wrap;gap:8px}.file-item:hover{background:rgba(255,255,255,.02)}.file-name{color:#60a5fa;word-break:break-all}.file-size{color:#94a3b8;font-size:12px;white-space:nowrap}.img-preview{max-width:150px;max-height:100px;border-radius:8px}.err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:14px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:12px;line-height:1.6}.warn-box{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);color:#fdba74;padding:10px 14px;border-radius:8px;font-size:12px;margin:0 0 14px 0;line-height:1.6}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.3);border-radius:10px}@media(max-width:768px){.header{flex-direction:column;text-align:center;padding:16px}th,td{padding:8px 10px;font-size:12px}.controls{flex-direction:column}.controls .btn{width:100%;justify-content:center}.tab-btn{flex:1;text-align:center;padding:8px 10px;font-size:12px}}</style></head><body><div class="container"><div class="header"><div><h1>🔥 Almohet · Firebase Exploiter</h1><div class="subtitle">Firestore · Storage · Auth (Public Client Config)</div></div><div id="statusBadge" class="badge-warn">⏳ تهيئة...</div></div><div id="warnBox"></div><div class="controls"><button class="btn btn-primary" id="loadBtn" onclick="loadAll()">📥 تحميل الكل</button><button class="btn btn-success" onclick="exportCSV()">📤 تصدير CSV</button><button class="btn btn-secondary" onclick="refreshAll()">🔄 تحديث</button></div><div class="tabs"><button class="tab-btn active" data-tab="users" onclick="switchTab('users')">👥 المستخدمين</button><button class="tab-btn" data-tab="firestore" onclick="switchTab('firestore')">📄 Firestore</button><button class="tab-btn" data-tab="storage" onclick="switchTab('storage')">📁 Storage</button><button class="tab-btn" data-tab="auth" onclick="switchTab('auth')">🔐 Auth</button></div><div id="panelUsers" class="panel active"><div class="table-wrapper" id="usersContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div></div><div id="panelFirestore" class="panel"><div class="table-wrapper" id="firestoreContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div></div><div id="panelStorage" class="panel"><div class="table-wrapper" id="storageContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div></div><div id="panelAuth" class="panel"><div class="table-wrapper" id="authContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div></div></div><script>
/* ملاحظة: FIREBASE_CONFIG هنا هو Public Client Config (وليس Admin SDK). appId من نوع android قد يسبب تحذير في Web SDK لكنه لا يمنع Firestore/Storage/Auth من العمل. الحماية الفعلية تعتمد على Security Rules. */
const FIREBASE_CONFIG={apiKey:"AIzaSyBiNZ9DR0rYngTh3w_4BM-h1kOJUA_3IU4",authDomain:"almohet-15f9c.firebaseapp.com",projectId:"almohet-15f9c",storageBucket:"almohet-15f9c.firebasestorage.app",messagingSenderId:"686314609729",appId:"1:686314609729:android:78bc3ef25a7744c1b7fac0"};
let db,storage,auth,initErr=null;
let allUsers=[],allFirestoreData={},allStorageFiles=[];
function showToast(m,t='info'){const x=document.querySelector('.toast');if(x)x.remove();const el=document.createElement('div');el.className='toast toast-'+t;el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),4500);}
function fmtErr(e){if(!e)return'Unknown error';const c=e.code?'['+e.code+'] ':'';const m=e.message||String(e);const s=e.stack?'\n\n─── STACK ───\n'+e.stack.split('\n').slice(0,4).join('\n'):'';return c+m+s;}
function errBox(e,ctx){return'<div class="err-box">❌ '+(ctx?ctx+'\n\n':'')+fmtErr(e)+'</div>';}
window.addEventListener('error',e=>{console.error('[GlobalErr]',e.error||e.message);showToast('⚠️ '+(e.error?.message||e.message),'error');});
window.addEventListener('unhandledrejection',e=>{console.error('[Promise]',e.reason);showToast('⚠️ Promise: '+(e.reason?.message||e.reason),'error');});
try{if(typeof firebase==='undefined')throw new Error('Firebase SDK لم يتم تحميله (تحقق من الاتصال بالإنترنت)');firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();storage=firebase.storage();auth=firebase.auth();console.log('[Firebase] initialized OK');}catch(e){initErr=e;console.error('[Firebase INIT FAIL]',e);}
if(FIREBASE_CONFIG.appId.includes(':android:')){document.getElementById('warnBox').innerHTML='<div class="warn-box">⚠️ <b>تنبيه:</b> appId الحالي من نوع <code>android</code> بينما Web SDK يفضل نوع <code>web</code>. Firestore/Storage/Auth ستعمل لكن قد تظهر تحذيرات في Console. للحل: أضف Web App في Firebase Console واستبدل appId.</div>';}
function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector('.tab-btn[data-tab="'+tab+'"]').classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');}
async function loadAll(){if(initErr){document.getElementById('statusBadge').className='badge-error';document.getElementById('statusBadge').textContent='❌ فشل التهيئة';document.getElementById('usersContainer').innerHTML=errBox(initErr,'فشل تهيئة Firebase');showToast('❌ فشل التهيئة: '+initErr.message,'error');return;}
const btn=document.getElementById('loadBtn');btn.disabled=true;btn.innerHTML='⏳ جاري...';document.getElementById('statusBadge').className='badge-warn';document.getElementById('statusBadge').textContent='⏳ جاري...';
const results=await Promise.allSettled([loadUsers(),loadFirestore(),loadStorage(),loadAuth()]);
const failed=results.filter(r=>r.status==='rejected');
if(failed.length===0){document.getElementById('statusBadge').className='badge-connected';document.getElementById('statusBadge').textContent='✅ متصل';showToast('✅ تم تحميل كل البيانات','success');}
else if(failed.length===results.length){document.getElementById('statusBadge').className='badge-error';document.getElementById('statusBadge').textContent='❌ خطأ كامل';showToast('❌ فشل كل المهام - راجع التفاصيل','error');failed.forEach(f=>console.error('[LoadAll fail]',f.reason));}
else{document.getElementById('statusBadge').className='badge-warn';document.getElementById('statusBadge').textContent='⚠️ جزئي ('+(results.length-failed.length)+'/'+results.length+')';showToast('⚠️ نجح جزئياً: '+(results.length-failed.length)+'/'+results.length,'info');}
btn.disabled=false;btn.innerHTML='📥 تحميل الكل';}
async function loadUsers(){const c=document.getElementById('usersContainer');try{const snap=await db.collection('users').get();allUsers=[];snap.forEach(d=>allUsers.push({id:d.id,...d.data()}));if(!allUsers.length){c.innerHTML='<div class="empty"><div class="icon">👥</div><div>لا يوجد مستخدمين (أو محمي بـ Rules)</div></div>';return;}
let h='<table><thead><tr><th>#</th><th>UID</th><th>البريد</th><th>الاسم</th><th>الدور</th><th>الحالة</th></tr></thead><tbody>';
allUsers.forEach((u,i)=>{const rc=u.role==='admin'?'badge-admin':'badge-user';h+='<tr><td>'+(i+1)+'</td><td><code style="font-size:11px;color:#94a3b8">'+(u.uid||u.id||'—')+'</code></td><td>'+(u.email||'—')+'</td><td>'+(u.displayName||u.name||'—')+'</td><td><span class="badge '+rc+'">'+(u.role||'user')+'</span></td><td>'+(u.isBlocked?'⛔ محظور':'✅ نشط')+'</td></tr>';});
h+='</tbody></table>';c.innerHTML=h;}catch(e){console.error('[loadUsers]',e);c.innerHTML=errBox(e,'فشل جلب users من Firestore');throw e;}}
async function loadFirestore(){const c=document.getElementById('firestoreContainer');const cols=['users','deposits','transactions','broadcasts','notifications','support_messages'];allFirestoreData={};let total=0;const errs=[];
for(const col of cols){try{const snap=await db.collection(col).get();const data=[];snap.forEach(d=>data.push({id:d.id,...d.data()}));allFirestoreData[col]=data;total+=data.length;}catch(e){allFirestoreData[col]=[];errs.push(col+': '+(e.code||'')+' '+e.message);console.error('[Firestore '+col+']',e);}}
let h='';if(errs.length)h+='<div class="err-box">⚠️ بعض المجموعات فشلت:\n'+errs.join('\n')+'</div>';
if(total===0){c.innerHTML=h+'<div class="empty"><div class="icon">📄</div><div>لا توجد وثائق (فارغة أو محمية بـ Rules)</div></div>';return;}
h+='<table><thead><tr><th>#</th><th>المجموعة</th><th>عدد الوثائق</th><th>عينة</th></tr></thead><tbody>';let idx=0;
for(const[col,data]of Object.entries(allFirestoreData)){if(!data.length)continue;idx++;const sample=data.slice(0,2).map(d=>JSON.stringify(d).substring(0,80)+'...').join('<br>');h+='<tr><td>'+idx+'</td><td><strong>'+col+'</strong></td><td>'+data.length+'</td><td style="font-size:12px;color:#94a3b8">'+sample+'</td></tr>';}
h+='</tbody></table>';c.innerHTML=h;}
async function loadStorage(){const c=document.getElementById('storageContainer');allStorageFiles=[];try{const listRef=storage.ref('/');const result=await listRef.listAll();allStorageFiles=result.items;
if(!allStorageFiles.length&&!result.prefixes.length){c.innerHTML='<div class="empty"><div class="icon">📁</div><div>لا توجد ملفات في الجذر</div></div>';return;}
let h='<div style="padding:12px">';if(result.prefixes.length)h+='<div style="color:#94a3b8;font-size:12px;margin-bottom:10px">📂 مجلدات فرعية: '+result.prefixes.map(p=>p.name).join(', ')+'</div>';
for(const item of allStorageFiles){try{const url=await item.getDownloadURL();const meta=await item.getMetadata().catch(()=>({size:0}));item.size=meta.size||0;const isImg=item.name.match(/\.(png|jpg|jpeg|gif|webp|svg)$/i);h+='<div class="file-item"><span class="file-name">📄 '+item.name+'</span><span class="file-size">'+(meta.size?(meta.size/1024).toFixed(1)+' KB':'—')+'</span><span><a href="'+url+'" target="_blank" style="color:#f97316">فتح ↗</a></span></div>';if(isImg)h+='<div style="padding:4px 12px 12px"><img src="'+url+'" class="img-preview" onerror="this.style.display=\'none\'"></div>';}catch(fe){h+='<div class="file-item"><span class="file-name">📄 '+item.name+'</span><span style="color:#f87171;font-size:11px">'+(fe.code||fe.message)+'</span></div>';}}
h+='</div>';c.innerHTML=h;}catch(e){console.error('[loadStorage]',e);c.innerHTML=errBox(e,'فشل الوصول إلى Storage (قد يكون محمياً بـ Rules)');throw e;}}
async function loadAuth(){const c=document.getElementById('authContainer');try{c.innerHTML='<div style="padding:20px"><h3 style="color:#f97316;margin-bottom:12px">🔐 اختبار Firebase Authentication</h3><div style="color:#94a3b8;font-size:12px;margin-bottom:14px;line-height:1.7">ℹ️ Web SDK لا يمكنه <b>سرد</b> كل المستخدمين (يتطلب Admin SDK على السيرفر). لكن يمكنه <b>إنشاء</b> حساب اختبار للتحقق من أن Auth مفعّل.</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><input id="authEmail" placeholder="البريد" style="flex:1;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e2e8f0;min-width:200px" value="test_'+Date.now().toString().slice(-6)+'@x.co"><input id="authPass" placeholder="كلمة المرور" type="password" style="flex:1;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e2e8f0;min-width:150px" value="Test123!"><button class="btn btn-primary" onclick="testAuth()">🚀 اختبار التسجيل</button></div><div id="authResult" style="background:rgba(0,0,0,.3);padding:12px;border-radius:8px;font-family:monospace;font-size:13px;color:#94a3b8;white-space:pre-wrap;min-height:60px">⏳ اضغط "اختبار التسجيل"</div></div>';}catch(e){console.error('[loadAuth]',e);c.innerHTML=errBox(e,'فشل تحضير لوحة Auth');throw e;}}
async function testAuth(){const email=document.getElementById('authEmail').value.trim();const pass=document.getElementById('authPass').value.trim();const r=document.getElementById('authResult');if(!email||!pass){r.textContent='❌ أدخل البريد وكلمة المرور';return;}r.textContent='⏳ جاري الاتصال...';try{const uc=await auth.createUserWithEmailAndPassword(email,pass);r.textContent='✅ تم إنشاء الحساب بنجاح!\n\nUID: '+uc.user.uid+'\nالبريد: '+uc.user.email+'\nتم التحقق: '+uc.user.emailVerified+'\nProvider: '+uc.user.providerId;showToast('✅ تم إنشاء الحساب','success');}catch(e){console.error('[testAuth]',e);r.textContent=fmtErr(e);showToast('❌ '+(e.code||e.message),'error');}}
function exportCSV(){if(!allUsers.length&&!allStorageFiles.length&&!Object.keys(allFirestoreData).length){showToast('⚠️ لا توجد بيانات - حمّل أولاً','error');return;}
let csv='=== المستخدمين ===\nUID,البريد,الاسم,الدور\n';allUsers.forEach(u=>csv+=(u.uid||u.id||'')+','+(u.email||'')+','+(u.displayName||u.name||'')+','+(u.role||'')+'\n');
csv+='\n=== Firestore ===\n';for(const[col,data]of Object.entries(allFirestoreData)){if(!data.length)continue;csv+='\n--- '+col+' ('+data.length+') ---\n';data.forEach(d=>csv+=JSON.stringify(d)+'\n');}
csv+='\n=== Storage ===\nاسم الملف,الحجم\n';allStorageFiles.forEach(f=>csv+=f.name+','+((f.size||0)/1024).toFixed(1)+' KB\n');
const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='almohet_firebase_'+new Date().toISOString().slice(0,10)+'.csv';link.click();showToast('✅ تم التصدير','success');}
function refreshAll(){loadAll();}
window.addEventListener('load',()=>{showToast('🔥 جاهز - بدء التحميل التلقائي...','info');setTimeout(loadAll,600);});
</script></body></html>
