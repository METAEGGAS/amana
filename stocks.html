<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توثيق الهوية</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f4f3fb;min-height:100vh;max-width:480px;margin:auto}
.hd{position:relative;background:linear-gradient(135deg,#6c6cf0,#8b5cf6);color:#fff;text-align:center;padding:18px 0 20px;font-size:19px;font-weight:700;overflow:hidden}
.hd .bg{position:absolute;inset:0;background:url('https://i.ibb.co/hRm446rn/IMG.png') center/cover;opacity:.5;z-index:0}
.hd .t{position:relative;z-index:1}
.hd .bk{position:absolute;left:14px;top:16px;z-index:2;color:#fff;font-size:22px;cursor:pointer;text-decoration:none}
.card{background:#fff;border-radius:14px;margin:16px;padding:8px 18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #eee;cursor:pointer}
.row:last-child{border:0}
.row .ic{font-size:20px;color:#555;width:26px;text-align:center}
.row .lb{flex:1;color:#888;font-size:15px}
.row .vl{flex:1;color:#222;font-size:15px}
.row .ar{color:#999;font-size:18px}
.row input{flex:1;border:0;outline:0;font-size:15px;color:#222;background:none}
.row input::placeholder{color:#aaa}
.sec{margin:18px 18px 10px;font-size:16px;font-weight:700;color:#222}
.up{background:#efeafd;border-radius:14px;margin:0 16px 16px;padding:34px 18px 14px;text-align:center;cursor:pointer;position:relative}
.up .fr{position:relative;border:2px dashed transparent;background:#d9cffb;border-radius:10px;padding:26px 14px}
.up .fr:before,.up .fr:after,.up .fr i:before,.up .fr i:after{content:'';position:absolute;width:26px;height:26px;border:4px solid #b39df0}
.up .fr:before{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.up .fr:after{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.up .fr i:before{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.up .fr i:after{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.up img{max-width:150px;display:block;margin:auto}
.up p{color:#8a84a8;font-size:13px;margin-top:14px}
.up input[type=file]{display:none}
.btn{display:block;width:calc(100% - 32px);margin:10px 16px 30px;padding:15px;border:0;border-radius:12px;background:#2f6bff;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.ov.on{display:block}
.sh{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px 18px 30px;max-height:70vh;overflow-y:auto}
.sh .hd2{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;margin-bottom:10px}
.sh .x{cursor:pointer;color:#999;font-size:20px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;border-bottom:1px solid #f0f0f0;font-size:15px;color:#333;cursor:pointer}
.opt:last-child{border:0}
.opt.sel{color:#7c5cf0}
.opt .ck{color:#7c5cf0;font-size:18px}
</style></head><body>
<div class="hd"><a class="bk" href="#">&lt;</a><div class="bg"></div><div class="t">توثيق الهوية</div></div>
<div class="card">
<div class="row" onclick="openSh('cSh')"><span class="ic">🌐</span><span class="vl" id="cVal">United States</span><span class="ar">&gt;</span></div>
<div class="row"><span class="ic">👤</span><input id="nm" placeholder="يرجى إدخال الاسم"></div>
<div class="row" onclick="openSh('dSh')"><span class="ic">🪪</span><span class="lb" id="dVal">يرجى اختيار نوع الوثيقة</span><span class="ar">&gt;</span></div>
<div class="row"><span class="ic">💳</span><input id="idn" placeholder="يرجى إدخال رقم بطاقة الهوية"></div>
</div>
<div class="sec">صورة بطاقة الهوية</div>
<label class="up"><input type="file" accept="image/*" onchange="prev(this,'fImg')"><div class="fr"><i></i><img id="fImg" src="https://gulfxdl.com/assets/idImg1-light-BjGturpJ.png"></div><p>يرجى رفع صورة بطاقة الهوية من الوجه الأمامي</p></label>
<label class="up"><input type="file" accept="image/*" onchange="prev(this,'bImg')"><div class="fr"><i></i><img id="bImg" src="https://gulfxdl.com/assets/idImg2-light-D2XNgiST.png"></div><p>يرجى رفع صورة بطاقة الهوية من الوجه الخلفي</p></label>
<button class="btn" onclick="sub()">إرسال</button>
<div class="ov" id="cOv" onclick="closeSh('cSh')"><div class="sh" id="cSh" onclick="event.stopPropagation()"><div class="hd2"><span>يرجى اختيار الجنسية</span><span class="x" onclick="closeSh('cSh')">✕</span></div><div id="cList"></div></div></div>
<div class="ov" id="dOv" onclick="closeSh('dSh')"><div class="sh" id="dSh" onclick="event.stopPropagation()"><div class="hd2"><span>يرجى اختيار نوع الوثيقة</span><span class="x" onclick="closeSh('dSh')">✕</span></div><div id="dList"></div></div></div>
<script>
var Cs=['United States','Spain','France','Portugal','Germany','Italy','Japan'],Ds=['بطاقة الهوية','جواز السفر','رخصة القيادة'],cSel=0,dSel=-1;
function render(){var h='';Cs.forEach(function(c,i){h+='<div class="opt'+(i==cSel?' sel':'')+'" onclick="pickC('+i+')">'+c+(i==cSel?'<span class="ck">✓</span>':'')+'</div>'});document.getElementById('cList').innerHTML=h;
var h2='';Ds.forEach(function(d,i){h2+='<div class="opt'+(i==dSel?' sel':'')+'" onclick="pickD('+i+')">'+d+(i==dSel?'<span class="ck">✓</span>':'')+'</div>'});document.getElementById('dList').innerHTML=h2}
function openSh(id){document.getElementById(id.replace('Sh','Ov')).classList.add('on');document.getElementById(id).parentElement.classList.add('on')}
function closeSh(id){document.getElementById(id).parentElement.classList.remove('on')}
function pickC(i){cSel=i;document.getElementById('cVal').textContent=Cs[i];render();closeSh('cSh')}
function pickD(i){dSel=i;document.getElementById('dVal').textContent=Ds[i];document.getElementById('dVal').style.color='#222';render();closeSh('dSh')}
function prev(inp,img){if(inp.files&&inp.files[0]){var r=new FileReader();r.onload=function(e){document.getElementById(img).src=e.target.result};r.readAsDataURL(inp.files[0])}}
function sub(){var n=document.getElementById('nm').value.trim(),d=document.getElementById('idn').value.trim();
if(!n)return alert('يرجى إدخال الاسم');if(dSel<0)return alert('يرجى اختيار نوع الوثيقة');if(!d)return alert('يرجى إدخال رقم بطاقة الهوية');
alert('تم إرسال طلب توثيق الهوية بنجاح ✓')}
render();
</script></body></html>
