<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توثيق الهوية</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
input{user-select:text}
body{background:#f4f3fb;min-height:100vh;max-width:480px;margin:auto}
.hd{position:relative;background:linear-gradient(135deg,#6c6cf0,#8b5cf6);color:#fff;text-align:center;padding:20px 0 22px;font-size:20px;font-weight:800;overflow:hidden}
.hd .bg{position:absolute;inset:0;background:url('https://i.ibb.co/hRm446rn/IMG.png') center/cover;opacity:.5}
.hd .t{position:relative}
.hd .bk{position:absolute;left:14px;top:20px;cursor:pointer}
svg{display:block}
.card{background:#fff;border-radius:14px;margin:16px;padding:10px 20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row{display:flex;flex-direction:row-reverse;align-items:center;gap:16px;padding:20px 0;border-bottom:1.5px solid #eee;cursor:pointer}
.row:last-child{border:0}
.row .ic{width:26px;height:26px;color:#4a4a55;flex-shrink:0}
.row .lb{flex:1;color:#888;font-size:15px;font-weight:600}
.row .vl{flex:1;color:#1c1c22;font-size:15px;font-weight:700}
.row .ar{color:#999}
.row input{flex:1;border:0;outline:0;font-size:15px;font-weight:600;color:#1c1c22;background:none;font-family:inherit;text-align:right}
.row input::placeholder{color:#a3a3ad;font-weight:500}
.sec{margin:20px 18px 10px;font-size:17px;font-weight:800;color:#1c1c22}
.up{background:#efeafd;border-radius:14px;margin:0 16px 16px;padding:36px 18px 16px;text-align:center;cursor:pointer;display:block}
.up .fr{position:relative;background:#d9cffb;border-radius:10px;padding:28px 14px}
.c{position:absolute;width:28px;height:28px;border:5px solid #b39df0}
.c1{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:9px 0 0 0}
.c2{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 9px 0 0}
.c3{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 9px}
.c4{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 9px 0}
.up img{max-width:155px;display:block;margin:auto}
.up p{color:#7d77a0;font-size:13px;font-weight:600;margin-top:16px}
.up input[type=file]{display:none}
.btn{display:block;width:calc(100% - 32px);margin:12px 16px 32px;padding:16px;border:0;border-radius:12px;background:#2f6bff;color:#fff;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
.ov.on{display:block}
.sh{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:22px 20px 32px;max-height:70vh;overflow-y:auto}
.sh .hd2{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;margin-bottom:12px}
.sh .x{cursor:pointer;color:#999}
.opt{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;padding:19px 4px;border-bottom:1.5px solid #f0f0f0;font-size:15px;font-weight:700;color:#2a2a32;cursor:pointer}
.opt:last-child{border:0}
.opt.sel{color:#7c5cf0}
.opt .ck{color:#7c5cf0}
</style></head><body>
<div class="hd"><span class="bk" onclick="history.back()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span><div class="bg"></div><div class="t">توثيق الهوية</div></div>
<div class="card">
<div class="row" onclick="openSh('cOv')"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg></span><span class="vl" id="cVal">United States</span><span class="ar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="row"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg></span><input id="nm" placeholder="يرجى إدخال الاسم"></div>
<div class="row" onclick="openSh('dOv')"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16.5c.8-1.5 1.8-2.2 3-2.2s2.2.7 3 2.2M14 9h5M14 12.5h5M14 16h3"/></svg></span><span class="lb" id="dVal">يرجى اختيار نوع الوثيقة</span><span class="ar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="row"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span><input id="idn" placeholder="يرجى إدخال رقم بطاقة الهوية"></div>
</div>
<div class="sec">صورة بطاقة الهوية</div>
<label class="up"><input type="file" accept="image/*" onchange="prev(this,'fImg')"><div class="fr"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><img id="fImg" src="https://gulfxdl.com/assets/idImg1-light-BjGturpJ.png"></div><p>يرجى رفع صورة بطاقة الهوية من الوجه الأمامي</p></label>
<label class="up"><input type="file" accept="image/*" onchange="prev(this,'bImg')"><div class="fr"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><img id="bImg" src="https://gulfxdl.com/assets/idImg2-light-D2XNgiST.png"></div><p>يرجى رفع صورة بطاقة الهوية من الوجه الخلفي</p></label>
<button class="btn" onclick="sub()">إرسال</button>
<div class="ov" id="cOv" onclick="closeSh('cOv')"><div class="sh" onclick="event.stopPropagation()"><div class="hd2"><span>يرجى اختيار الجنسية</span><span class="x" onclick="closeSh('cOv')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div><div id="cList"></div></div></div>
<div class="ov" id="dOv" onclick="closeSh('dOv')"><div class="sh" onclick="event.stopPropagation()"><div class="hd2"><span>يرجى اختيار نوع الوثيقة</span><span class="x" onclick="closeSh('dOv')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div><div id="dList"></div></div></div>
<script>
var Cs=['United States','Spain','France','Portugal','Germany','Italy','Japan'],Ds=['بطاقة الهوية','جواز السفر','رخصة القيادة'],cSel=0,dSel=-1,
CK='<span class="ck"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>';
function render(){var h='';Cs.forEach(function(c,i){h+='<div class="opt'+(i==cSel?' sel':'')+'" onclick="pickC('+i+')"><span>'+c+'</span>'+(i==cSel?CK:'')+'</div>'});document.getElementById('cList').innerHTML=h;
var h2='';Ds.forEach(function(d,i){h2+='<div class="opt'+(i==dSel?' sel':'')+'" onclick="pickD('+i+')"><span>'+d+'</span>'+(i==dSel?CK:'')+'</div>'});document.getElementById('dList').innerHTML=h2}
function openSh(id){document.getElementById(id).classList.add('on')}
function closeSh(id){document.getElementById(id).classList.remove('on')}
function pickC(i){cSel=i;document.getElementById('cVal').textContent=Cs[i];render();closeSh('cOv')}
function pickD(i){dSel=i;document.getElementById('dVal').textContent=Ds[i];document.getElementById('dVal').style.color='#1c1c22';render();closeSh('dOv')}
function prev(inp,img){if(inp.files&&inp.files[0]){var r=new FileReader();r.onload=function(e){document.getElementById(img).src=e.target.result};r.readAsDataURL(inp.files[0])}}
function sub(){var n=document.getElementById('nm').value.trim(),d=document.getElementById('idn').value.trim();
if(!n)return alert('يرجى إدخال الاسم');if(dSel<0)return alert('يرجى اختيار نوع الوثيقة');if(!d)return alert('يرجى إدخال رقم بطاقة الهوية');
alert('تم إرسال طلب توثيق الهوية بنجاح ✓')}
render();
</script></body></html>
