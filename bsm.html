<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأسهم</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,'Segoe UI',sans-serif}
body{background:#f3f4f9}
.pg{max-width:430px;margin:auto;padding:16px 14px;min-height:100vh}
.srch{direction:ltr;background:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:9px;color:#9aa1b0;font-size:15px;box-shadow:0 1px 4px rgba(23,26,36,.05)}
h2{font-size:18px;font-weight:800;color:#171a24;margin:24px 2px 13px}
.grid{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cd{border-radius:16px;padding:14px}
.cr{background:#fdecef}.cg{background:#e3f6ef}
.tp{display:flex;justify-content:space-between;align-items:center}
.tk{font-size:17px;font-weight:800;color:#171a24;letter-spacing:.4px}
.pr{font-size:19px;font-weight:800}
.cr .pr,.cr .ch{color:#e04b5a}.cg .pr,.cg .ch{color:#0d9e78}
.ch{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:13px;font-weight:800;margin-top:7px}
.sp{display:block;margin-top:9px}
.wc{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(23,26,36,.05)}
.emp{padding:46px 16px;text-align:center;color:#8a8f9e;font-size:13px}
.btn{display:inline-block;margin-top:18px;padding:9px 28px;border:1.5px solid #7b6cf0;border-radius:10px;color:#6a5ae0;font-weight:800;font-size:14px;cursor:pointer}
.rw2{direction:ltr;display:flex;justify-content:space-between;align-items:center;margin:24px 2px 13px}
.rw2 h2{margin:0}
.pill{background:#fff;border:1px solid #e7e9f1;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:800;color:#3c4152;display:flex;align-items:center;gap:6px}
.lst{direction:ltr;display:flex;flex-direction:column;gap:11px}
.rw{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 4px rgba(23,26,36,.05)}
.lg{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nm{flex:1}.nm b{font-size:16px;color:#171a24}.nm span{display:block;font-size:12.5px;color:#9aa1b0;margin-top:3px}
.vl{text-align:right}.vl b{font-size:17px;color:#171a24}.vl span{display:block;font-size:13px;font-weight:800;margin-top:3px}
.dn{color:#e04b5a}.up{color:#0d9e78}
</style></head><body><div class="pg">

<div class="cd cg"><div class="tp"><span class="tk">TSLA</span><span class="pr">364.43</span></div><svg class="sp" width="95" height="26"><polyline points="0,15 10,11 20,16 30,12 40,17 50,13 60,18 70,14 80,17 95,12" fill="none" stroke="#0d9e78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="ch"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 1l4 6H1z" fill="currentColor"/></svg>+4.73%</div></div>

</div>
