<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>رمز التحقق · FXER</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #0a1328;
      font-family: 'Noto Sans Arabic', system-ui, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #0f1a30;
      border-radius: 32px;
      padding: 28px 22px 32px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      color: #a2b6cb;
      font-size: 15px;
      font-weight: 500;
    }
    .back-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .hero { text-align: center; padding: 6px 0 14px; }
    .hero-icon {
      width: 76px; height: 76px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1e2f5a, #0f1a30);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .hero-icon img { width: 44px; height: 44px; object-fit: contain; display: block; }
    .hero h2 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
    .hero p { color: #9aa8c4; font-size: 14px; }
    .hero .email-highlight { color: #ff9d3f; font-weight: 600; direction: ltr; display: inline-block; }
    .field { margin: 20px 0 10px; }
    .field label { display: block; font-size: 13px; color: #c8d0e0; margin-bottom: 8px; font-weight: 500; }
    .code-input {
      width: 100%;
      background: #122142;
      border: 1px solid #1e2f5a;
      border-radius: 16px;
      padding: 16px 12px;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 12px;
      direction: ltr;
      font-family: 'Noto Sans Arabic', monospace;
      outline: none;
      transition: border 0.2s;
    }
    .code-input:focus { border-color: #ff7a00; }
    .code-input::placeholder { letter-spacing: 4px; color: #3f4d6a; font-weight: 400; }
    .row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 2px 22px;
      font-size: 13px;
    }
    .timer { color: #ffd043; font-weight: 600; }
    .resend {
      color: #9aa8c4;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .resend.active { color: #ff9d3f; font-weight: 600; }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #ff7a00, #ff9d3f);
      border: none;
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 8px 22px rgba(255,122,0,0.25);
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    .msg {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
      min-height: 20px;
    }
    .msg.ok { color: #5fd68a; }
    .msg.er { color: #e57373; }
    .mock-back { display: flex; align-items: center; gap: 12px; color: #a2b6cb; font-size: 14px; margin-bottom: 6px; cursor: pointer; }
    .mock-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .api-status {
      background: #122142;
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 12px;
      color: #9aa8c4;
      border: 1px solid #1e2f5a;
      direction: ltr;
      text-align: left;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .api-status .label {
      color: #6d7a95;
      font-weight: 500;
      direction: rtl;
    }
    .api-status .value {
      color: #5fd68a;
      font-family: monospace;
      font-size: 11px;
      flex: 1;
    }
    .api-status .loading {
      color: #ffd043;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- رأس الصفحة مع زر الرجوع -->
  <div class="mock-back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M4 12l6-6M4 12l6 6M4 12h16"/></svg>
    <span>العودة</span>
  </div>

  <div class="hero">
    <div class="hero-icon">
      <img src="https://i.ibb.co/rKKw4nGB/IMG.png" alt="رمز التحقق">
    </div>
    <h2>أدخل رمز التحقق</h2>
    <p>تم إرسال رمز مكوّن من 6 أرقام إلى<br><span class="email-highlight" id="emVerifyTo">05318352256vbn@gmail.com</span></p>
  </div>

  <!-- عرض حالة API المسترجعة من Firebase -->
  <div class="api-status" id="apiStatus">
    <span class="label">🔑 مفتاح API:</span>
    <span class="value loading" id="apiKeyDisplay">⏳ جارٍ الجلب من Firebase...</span>
  </div>

  <div class="field">
    <label>رمز التحقق</label>
    <input type="text" class="code-input" id="emCodeIn" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code" value="">
  </div>

  <div class="row-flex">
    <span class="timer" id="emTmr">05:00</span>
    <span class="resend" id="emRsn" onclick="resendCode()">إعادة الإرسال</span>
  </div>

  <button class="btn-primary" id="emBtn" onclick="confirmCode()">تأكيد</button>
  <div class="msg" id="emMsg"></div>
</div>

<script type="module">
  // ============================================================
  // 1. استيراد Firebase SDK
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // ============================================================
  // 2. إعداد Firebase
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDQIKQ5swu_XnVtqET0B9EelRKFjr0LXHI",
    authDomain: "ksksjsh-724f2.firebaseapp.com",
    projectId: "ksksjsh-724f2",
    storageBucket: "ksksjsh-724f2.firebasestorage.app",
    messagingSenderId: "1046924412561",
    appId: "1:1046924412561:web:1a40834236da75d0d6e130",
    measurementId: "G-5D3YJQDH8B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ============================================================
  // 3. جلب مفتاح API من Firebase
  // ============================================================
  const DOCUMENT_ID = "5INsxHHFbHpbsENijktR";
  const FIELD_NAME = "api";

  let BREVO_API_KEY = null;

  const apiKeyDisplay = document.getElementById('apiKeyDisplay');

  async function fetchApiKeyFromFirebase() {
    try {
      apiKeyDisplay.textContent = '⏳ جارٍ الجلب من Firebase...';
      apiKeyDisplay.className = 'value loading';

      const docRef = doc(db, "api", DOCUMENT_ID);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        BREVO_API_KEY = data[FIELD_NAME] || null;

        if (BREVO_API_KEY) {
          const first8 = BREVO_API_KEY.substring(0, 8);
          const last4 = BREVO_API_KEY.substring(BREVO_API_KEY.length - 4);
          const masked = `${first8}••••••••••••••${last4}`;
          apiKeyDisplay.textContent = masked;
          apiKeyDisplay.className = 'value';
          apiKeyDisplay.style.color = '#5fd68a';
          console.log('✅ تم جلب مفتاح API بنجاح من Firebase');
          return true;
        } else {
          apiKeyDisplay.textContent = '❌ الحقل "api" فارغ أو غير موجود';
          apiKeyDisplay.className = 'value er';
          apiKeyDisplay.style.color = '#e57373';
          console.error('❌ الحقل "api" غير موجود في المستند');
          return false;
        }
      } else {
        apiKeyDisplay.textContent = '❌ المستند غير موجود في Firebase';
        apiKeyDisplay.className = 'value er';
        apiKeyDisplay.style.color = '#e57373';
        console.error('❌ المستند غير موجود');
        return false;
      }
    } catch (error) {
      console.error('❌ خطأ في جلب المفتاح من Firebase:', error);
      apiKeyDisplay.textContent = '❌ فشل الجلب: ' + error.message;
      apiKeyDisplay.className = 'value er';
      apiKeyDisplay.style.color = '#e57373';
      return false;
    }
  }

  // ============================================================
  // 4. دوال إرسال البريد باستخدام Brevo API - قالب احترافي
  // ============================================================
  const SENDER_EMAIL = "noreply.eptinex@gmail.com";
  const SENDER_NAME = "FXER";
  const RECIPIENT_EMAIL = "05318352256vbn@gmail.com";

  function getFormattedDate() {
    const now = new Date();
    return now.toLocaleString('ar-EG', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      timeZone: 'Asia/Riyadh'
    });
  }

  async function sendCodeViaBrevo(email, code) {
    if (!BREVO_API_KEY) {
      throw new Error('❌ مفتاح API غير متاح. يرجى التأكد من جلب المفتاح من Firebase.');
    }

    const currentDate = getFormattedDate();

    const htmlContent = `
      <!DOCTYPE html>
      <html dir="rtl">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>رمز التحقق - FXER</title>
        <style>
          body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
          .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #0a1328;
            direction: rtl;
          }
          .email-wrapper {
            background: linear-gradient(145deg, #122142, #0f1a30);
            border-radius: 24px;
            padding: 40px 35px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
          }
          .header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
          }
          .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ff7a00;
            letter-spacing: 2px;
            display: inline-block;
            background: linear-gradient(135deg, #ff7a00, #ff9d3f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          }
          .logo-sub {
            font-size: 12px;
            color: #6d7a95;
            display: block;
            margin-top: 4px;
            -webkit-text-fill-color: #6d7a95;
          }
          .content {
            padding: 30px 0;
            text-align: center;
          }
          .greeting {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
          }
          .sub-greeting {
            font-size: 14px;
            color: #9aa8c4;
            margin-bottom: 25px;
          }
          .code-box {
            background: linear-gradient(135deg, #1a2745, #122142);
            border-radius: 16px;
            padding: 25px 30px;
            margin: 20px 0 25px;
            border: 1px solid rgba(255,122,0,0.2);
            box-shadow: 0 0 40px rgba(255,122,0,0.05);
            display: inline-block;
            min-width: 280px;
          }
          .code-label {
            font-size: 12px;
            color: #6d7a95;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
          }
          .code-value {
            font-size: 48px;
            font-weight: 800;
            color: #ff7a00;
            letter-spacing: 12px;
            font-family: 'Courier New', monospace;
            margin: 8px 0 4px;
            text-shadow: 0 0 30px rgba(255,122,0,0.15);
          }
          .code-hint {
            font-size: 13px;
            color: #ffd043;
            font-weight: 500;
          }
          .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0 30px;
            text-align: center;
          }
          .info-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 10px;
            border: 1px solid rgba(255,255,255,0.04);
          }
          .info-item .label {
            font-size: 11px;
            color: #6d7a95;
            text-transform: uppercase;
            letter-spacing: 1px;
          }
          .info-item .value {
            font-size: 13px;
            color: #c8d0e0;
            font-weight: 600;
            margin-top: 4px;
          }
          .info-item .value.email {
            color: #ff9d3f;
            direction: ltr;
            font-size: 12px;
          }
          .divider {
            height: 1px;
            background: linear-gradient(to left, transparent, rgba(255,255,255,0.06), transparent);
            margin: 25px 0;
          }
          .footer-text {
            font-size: 12px;
            color: #6d7a95;
            text-align: center;
            line-height: 1.8;
          }
          .footer-text a {
            color: #ff7a00;
            text-decoration: none;
          }
          .security-badge {
            display: inline-block;
            background: rgba(95,214,138,0.08);
            color: #5fd68a;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(95,214,138,0.15);
          }
          @media (max-width: 480px) {
            .email-wrapper { padding: 25px 18px; }
            .code-value { font-size: 36px; letter-spacing: 8px; }
            .info-grid { grid-template-columns: 1fr; }
            .code-box { min-width: auto; width: 100%; }
          }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="email-wrapper">
            <div class="header">
              <div class="logo">FXER</div>
              <span class="logo-sub">منصة التداول الذكية</span>
            </div>
            <div class="content">
              <div class="greeting">مرحباً بك في FXER 👋</div>
              <div class="sub-greeting">لقد طلبت رمز تحقق لتأكيد هويتك</div>

              <div class="code-box">
                <div class="code-label">رمز التحقق الخاص بك</div>
                <div class="code-value">${code}</div>
                <div class="code-hint">⏳ صالح لمدة 5 دقائق</div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="label">البريد المستلم</div>
                  <div class="value email">${email}</div>
                </div>
                <div class="info-item">
                  <div class="label">تاريخ الطلب</div>
                  <div class="value">${currentDate}</div>
                </div>
                <div class="info-item">
                  <div class="label">صلاحية الرمز</div>
                  <div class="value">5 دقائق</div>
                </div>
                <div class="info-item">
                  <div class="label">الأمان</div>
                  <div class="value"><span class="security-badge">🔒 مشفر</span></div>
                </div>
              </div>

              <div class="divider"></div>

              <div style="text-align:center;margin-bottom:20px;">
                <span style="font-size:12px;color:#6d7a95;">💡 إذا لم تطلب هذا الرمز، يرجى تجاهل هذا البريد</span>
              </div>

              <div class="footer-text">
                هذا بريد إلكتروني تلقائي من <strong>FXER</strong><br>
                للدعم: <a href="mailto:support@fxer.com">support@fxer.com</a>
                <br><br>
                <span style="font-size:10px;color:#4a5670;">© ${new Date().getFullYear()} FXER - جميع الحقوق محفوظة</span>
              </div>
            </div>
          </div>
        </div>
      </body>
      </html>
    `;

    const payload = {
      sender: { name: SENDER_NAME, email: SENDER_EMAIL },
      to: [{ email: email }],
      subject: "🔐 رمز التحقق الخاص بك - منصة FXER",
      htmlContent: htmlContent
    };

    const response = await fetch('https://api.brevo.com/v3/smtp/email', {
      method: 'POST',
      headers: {
        'accept': 'application/json',
        'content-type': 'application/json',
        'api-key': BREVO_API_KEY
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const errorData = await response.json();
      console.error('Brevo API Error:', errorData);
      throw new Error(`فشل الإرسال: ${response.status} - ${errorData.message || 'خطأ غير معروف'}`);
    }

    return true;
  }

  // ============================================================
  // 5. منطق التطبيق (التحقق من الرمز، المؤقت 5 دقائق)
  // ============================================================
  const CODE_DURATION = 5 * 60 * 1000; // 5 دقائق بالمللي ثانية

  const state = {
    code: null,
    exp: 0,
    timerInterval: null,
    email: RECIPIENT_EMAIL,
    isSending: false
  };

  const codeInput = document.getElementById('emCodeIn');
  const timerEl = document.getElementById('emTmr');
  const resendEl = document.getElementById('emRsn');
  const msgEl = document.getElementById('emMsg');
  const emailDisplay = document.getElementById('emVerifyTo');
  const confirmBtn = document.getElementById('emBtn');

  emailDisplay.textContent = state.email;

  function generateCode() {
    let s = '';
    for (let i = 0; i < 6; i++) {
      s += Math.floor(Math.random() * 10);
    }
    return s;
  }

  function tickTimer() {
    const left = Math.max(0, Math.ceil((state.exp - Date.now()) / 1000));
    const minutes = String(Math.floor(left / 60)).padStart(2, '0');
    const seconds = String(left % 60).padStart(2, '0');
    timerEl.textContent = `${minutes}:${seconds}`;

    if (left <= 0) {
      state.code = null;
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      resendEl.classList.add('active');
      resendEl.style.color = '#ff9d3f';
      msgEl.textContent = '⏰ انتهت صلاحية الرمز، اضغط إعادة الإرسال';
      msgEl.className = 'msg er';
    } else {
      resendEl.classList.remove('active');
      resendEl.style.color = '';
      if (msgEl.textContent.includes('انتهت صلاحية')) {
        msgEl.textContent = '';
        msgEl.className = 'msg';
      }
    }
  }

  async function sendCode() {
    if (state.isSending) return;
    state.isSending = true;
    confirmBtn.disabled = true;

    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }

    if (!BREVO_API_KEY) {
      msgEl.textContent = '❌ مفتاح API غير متاح. يرجى تحديث الصفحة.';
      msgEl.className = 'msg er';
      state.isSending = false;
      confirmBtn.disabled = false;
      return;
    }

    state.code = generateCode();
    state.exp = Date.now() + CODE_DURATION;

    codeInput.value = '';
    msgEl.textContent = '⏳ جارٍ إرسال الرمز إلى بريدك ...';
    msgEl.className = 'msg';

    try {
      const success = await sendCodeViaBrevo(state.email, state.code);

      if (success) {
        msgEl.textContent = `✅ تم إرسال الرمز إلى ${state.email}`;
        msgEl.className = 'msg ok';
      } else {
        throw new Error('فشل الإرسال');
      }
    } catch (error) {
      console.error('Send error:', error);
      msgEl.textContent = `❌ ${error.message || 'تعذّر إرسال الرمز، حاول مرة أخرى'}`;
      msgEl.className = 'msg er';
      state.code = null;
      state.isSending = false;
      confirmBtn.disabled = false;
      return;
    }

    tickTimer();
    state.timerInterval = setInterval(tickTimer, 500);
    state.isSending = false;
    confirmBtn.disabled = false;
  }

  window.resendCode = function() {
    const left = Math.max(0, Math.ceil((state.exp - Date.now()) / 1000));
    if (left > 0) {
      msgEl.textContent = '⏳ الرمز الحالي لا يزال صالحاً، انتظر حتى ينتهي';
      msgEl.className = 'msg er';
      return;
    }
    sendCode();
  };

  window.confirmCode = function() {
    const entered = codeInput.value.trim();

    if (!entered) {
      msgEl.textContent = '⚠️ يرجى إدخال الرمز';
      msgEl.className = 'msg er';
      return;
    }

    if (!state.code) {
      msgEl.textContent = '⚠️ الرمز غير موجود، اضغط إعادة الإرسال';
      msgEl.className = 'msg er';
      return;
    }

    if (Date.now() > state.exp) {
      msgEl.textContent = '⏰ انتهت صلاحية الرمز، اضغط إعادة الإرسال';
      msgEl.className = 'msg er';
      return;
    }

    if (entered !== state.code) {
      msgEl.textContent = '❌ الرمز غير صحيح، حاول مجدداً';
      msgEl.className = 'msg er';
      return;
    }

    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
    state.code = null;
    msgEl.textContent = '✅ تم التحقق بنجاح! 🎉';
    msgEl.className = 'msg ok';
    timerEl.textContent = '05:00';
    resendEl.classList.add('active');
    resendEl.style.color = '#ff9d3f';
    confirmBtn.disabled = false;
  };

  codeInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmCode();
    }
  });

  // ============================================================
  // 6. تهيئة الصفحة: جلب المفتاح ثم إرسال الرمز
  // ============================================================
  async function init() {
    const keyFetched = await fetchApiKeyFromFirebase();

    if (keyFetched && BREVO_API_KEY) {
      setTimeout(() => {
        sendCode();
      }, 400);
    } else {
      msgEl.textContent = '⚠️ لا يمكن إرسال الرمز: مفتاح API غير متوفر';
      msgEl.className = 'msg er';
    }
  }

  init();
</script>
