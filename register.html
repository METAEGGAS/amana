<!DOCTYPE html><html lang="ar" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكمل عملية الدخول</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}body{background:#f7f8fa;min-height:100vh;user-select:none;-webkit-user-select:none}input{user-select:text;-webkit-user-select:text}header{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;text-align:center;padding:9px 0;font-size:16px;font-weight:600}.top-img{display:block;width:60%;max-width:210px;margin:12px auto 0;border-radius:10px}main{background:#fcfcff;min-height:calc(100vh - 38px);padding:14px 18px;display:flex;flex-direction:column}.tabs{display:flex;justify-content:center;gap:60px;font-size:16px;color:#333}.tabs span{padding-bottom:8px;cursor:pointer;color:#888}.tabs span.on{color:#111;font-weight:700;border-bottom:3px solid #6d5ef0}.fld{display:flex;align-items:center;gap:12px;border-bottom:2px solid #e2e2ec;padding:13px 2px 10px;margin-top:10px;transition:border-color .2s}.fld:focus-within{border-color:#6d5ef0}.fld svg{width:23px;height:23px;stroke:#555;fill:none;stroke-width:1.7;flex-shrink:0}.fld input{border:0;outline:0;flex:1;font-size:15px;background:none;color:#333;min-width:0}.fld input::placeholder{color:#bbb}.eye{cursor:pointer}.code-btn{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:20px;padding:8px 12px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}.code-btn.cnt{background:none;color:#1d6ff2;font-weight:700;font-size:14px;padding:8px 4px;opacity:1}.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#555}.chk input{width:16px;height:16px;accent-color:#6d5ef0;cursor:pointer}.chk a,.fp{color:#6d5ef0;text-decoration:none}.fp{display:block;text-align:left;font-size:13px;margin-top:12px}.btn{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;b
