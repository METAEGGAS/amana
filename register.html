<!DOCTYPE html><html lang="ar" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكمل عملية الدخول</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}body{background:#f7f8fa;min-height:100vh;user-select:none;-webkit-user-select:none}input{user-select:text;-webkit-user-select:text}header{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;text-align:center;padding:9px 0;font-size:16px;font-weight:600}.top-img{display:block;width:60%;max-width:210px;margin:12px auto 0;border-radius:10px}main{background:#fcfcff;min-height:calc(100vh - 38px);padding:14px 18px;display:flex;flex-direction:column}.tabs{display:flex;justify-content:center;gap:60px;font-size:16px;color:#333}.tabs span{padding-bottom:8px;cursor:pointer;color:#888}.tabs span.on{color:#111;font-weight:700;border-bottom:3px solid #6d5ef0}.fld{display:flex;align-items:center;gap:12px;border-bottom:2px solid #e2e2ec;padding:13px 2px 10px;margin-top:10px;transition:border-color .2s}.fld:focus-within{border-color:#6d5ef0}.fld svg{width:23px;height:23px;stroke:#555;fill:none;stroke-width:1.7;flex-shrink:0}.fld input{border:0;outline:0;flex:1;font-size:15px;background:none;color:#333;min-width:0}.fld input::placeholder{color:#bbb}.eye{cursor:pointer}.code-btn{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:20px;padding:8px 12px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}.code-btn.cnt{background:none;color:#1d6ff2;font-weight:700;font-size:14px;padding:8px 4px;opacity:1}.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#555}.chk input{width:16px;height:16px;accent-color:#6d5ef0;cursor:pointer}.chk a,.fp{color:#6d5ef0;text-decoration:none}.fp{display:block;text-align:left;font-size:13px;margin-top:12px;cursor:pointer}.btn{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:10px;border-radius:8px;font-size:13px;text-align:center}.msg.err{display:block;background:#fdecea;color:#c0392b}.msg.ok{display:block;background:#e8f8f0;color:#1e8e5a}.hide{display:none}.cap-ov{position:fixed;inset:0;background:rgba(15,12,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}.cap-ov.on{opacity:1;pointer-events:auto}.cap-box{width:min(340px,92vw);background:#fff;border-radius:18px;padding:18px 16px 20px;box-shadow:0 25px 70px rgba(40,20,120,.35);transform:translateY(30px) scale(.92);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}.cap-ov.on .cap-box{transform:translateY(0) scale(1)}.cap-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cap-hd b{font-size:15px;color:#222;display:flex;align-items:center;gap:7px}.cap-hd b svg{width:19px;height:19px;stroke:#6d5ef0;fill:none;stroke-width:2}.cap-x{cursor:pointer;color:#999;font-size:20px;line-height:1;padding:2px 6px;border-radius:6px;transition:.2s}.cap-x:hover{background:#f1f1f8;color:#333}.cap-cv{position:relative;width:100%;height:170px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#8a7bf7,#6d5ef0 45%,#4a3ecf);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.cap-cv::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,rgba(255,255,255,.25),transparent 40%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 60% 20%,rgba(0,0,0,.12),transparent 35%)}.cap-cv i{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}.cap-hole{position:absolute;top:55px;width:46px;height:46px;border-radius:10px;background:rgba(0,0,0,.38);box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.35)}.cap-piece{position:absolute;top:55px;width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#fff,#e8e6ff);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 2px rgba(109,94,240,.6);display:flex;align-items:center;justify-content:center;transition:box-shadow .2s;left:4px}.cap-piece::after{content:'';width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#6d5ef0,#8a7bf7)}.cap-sl{position:relative;margin-top:16px;height:46px;border-radius:23px;background:#f0effa;box-shadow:inset 0 1px 4px rgba(0,0,0,.08);overflow:hidden}.cap-fill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#c9c2f5,#8a7bf7);border-radius:23px}.cap-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#8a86a8;pointer-events:none;transition:opacity .2s}.cap-th{position:absolute;top:3px;left:3px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6d5ef0,#8a7bf7);box-shadow:0 3px 10px rgba(109,94,240,.5);cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:2}.cap-th:active{cursor:grabbing}.cap-th svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4}.cap-box.ok .cap-fill{background:linear-gradient(90deg,#a7e8c8,#1e8e5a)}.cap-box.ok .cap-th{background:linear-gradient(135deg,#1e8e5a,#2fc27e)}.cap-box.ok .cap-piece{box-shadow:0 0 0 3px #2fc27e,0 0 25px rgba(47,194,126,.8)}.cap-box.ok .cap-cv{animation:okGlow .6s}@keyframes okGlow{0%{box-shadow:0 0 0 0 rgba(47,194,126,.7)}100%{box-shadow:0 0 0 22px rgba(47,194,126,0)}}.cap-box.bad{animation:shk .45s}@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}.cap-st{margin-top:12px;text-align:center;font-size:13px;font-weight:600;min-height:18px;opacity:0;transition:opacity .25s}.cap-st.on{opacity:1}.cap-st.g{color:#1e8e5a}.cap-st.r{color:#c0392b}.cap-rf{position:absolute;bottom:8px;left:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}.cap-rf:hover{background:rgba(255,255,255,.45);transform:rotate(90deg)}.cap-rf svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2}</style></head><body><header>اكمل عملية الدخول</header><img class="top-img" src="https://i.ibb.co/0jZJCL1z/file-0000000095a081f483ce7ffa4c8f6313.png" alt=""><main><div class="tabs"><span id="tL" onclick="sw(0)">تسجيل الدخول</span><span id="tR" class="on" onclick="sw(1)">تسجيل</span></div><div id="msg" class="msg"></div><form id="login" class="hide" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="lem" type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input id="lpw" type="password" placeholder="يرجى إدخال كلمة المرور" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><label class="chk"><input type="checkbox">تذكرني</label><a class="fp" id="fp">نسيت كلمة السر؟</a><button class="btn" id="bL">تأكيد تسجيل الدخول</button></form><form id="reg" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="rem" type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><input id="rcd" type="text" placeholder="يرجى إدخال ر  viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button></div><div class="cap-sl" id="capSl"><div class="cap-fill" id="capFill"></div><div class="cap-txt" id="capTxt">اسحب لإكمال التحقق ←</div><div class="cap-th" id="capTh"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6M3 6l6 6-6 6"/></svg></div></div><div class="cap-st" id="capSt"></div></div></div><script>function sw(n){tL.classList.toggle('on',!n);tR.classList.toggle('on',!!n);login.classList.toggle('hide',!!n);reg.classList.toggle('hide',!n)}function pe(e){var i=e.previousElementSibling;i.type=i.type=='password'?'text':'password'}function go(){return false}try{history.replaceState(null,'','/pages/register/login')}catch(e){}['copy','cut','selectstart','contextmenu'].forEach(function(v){document.addEventListener(v,function(e){if(e.target.tagName!='INPUT')e.preventDefault()})})</script><script>!function(){var ov=document.getElementById('capOv'),box=document.getElementById('capBox'),cv=document.getElementById('capCv'),hole=document.getElementById('capHole'),piece=document.getElementById('capPiece'),th=document.getElementById('capTh'),fill=document.getElementById('capFill'),txt=document.getElementById('capTxt'),st=document.getElementById('capSt'),tx=0,drag=false,sx=0,px=0,done=false,pend=null;function reset(){box.classList.remove('ok','bad');st.className='cap-st';piece.style.left='4px';th.style.left='3px';fill.style.width='0';txt.style.opacity='1';piece.style.transition=th.style.transition=fill.style.transition='left .3s,width .3s';setTimeout(function(){piece.style.transition=th.style.transition=fill.style.transition='none'},300)}function gen(){var w=cv.clientWidth-50;tx=70+Math.floor(Math.random()*(w-80));hole.style.left=tx+'px';reset()}window.openCap=function(cb){pend=cb;done=false;ov.classList.add('on');setTimeout(gen,60)};document.getElementById('capX').onclick=function(){ov.classList.remove('on');pend=null};document.getElementById('capRf').onclick=gen;function mv(x){if(!drag||done)return; store(app),m=document.getElementById('msg');let vc=null,ve=0;function sh(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t}function ar(c){return{'auth/email-already-in-use':'هذا البريد الإلكتروني مسجل من قبل','auth/invalid-email':'البريد الإلكتروني غير صحيح','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/invalid-credential':'البريد الإلكتروني أو كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/wrong-password':'كلمة المرور غير صحيحة','auth/too-many-requests':'محاولات كثيرة، حاول لاحقًا'}[c]||'حدث خطأ، حاول مرة أخرى'}onAuthStateChanged(auth,u=>{if(u)location.replace('index.html')});document.getElementById('cb').addEventListener('click',async function(){const em=rem.value.trim();if(!em)return sh('أدخل بريدك الإلكتروني أولًا لإرسال رمز التحقق',0);const b=this;b.disabled=1;try{const s=await getDoc(doc(db,'smtp','smtpsjjsjs'));const key=s.data().smtp;vc=(''+Math.floor(1e6+Math.random()*9e6));ve=Date.now()+6e4;const r=await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':key,'Content-Type':'application/json'},body:JSON.stringify({sender:{name:'FXTEM',email:'noreply.eptinex@gmail.com'},to:[{email:em}],subject:'رمز التحقق',htmlContent:'<div dir="rtl" style="font-family:Arial;text-align:center"><h2>رمز التحقق الخاص بك</h2><p style="font-size:32px;font-weight:700;letter-spacing:6px;color:#6d5ef0">'+vc+'</p><p>الرمز صالح لمدة 60 ثانية فقط</p></div>'})});if(!r.ok)throw 0;let sec=60;b.classList.add('cnt');b.textContent='60S';const t=setInterval(()=>{sec--;if(sec>0)b.textContent=sec+'S';else{clearInterval(t);b.textContent='الحصول على رمز التحقق';b.disabled=0;b.classList.remove('cnt')}},1e3)}catch(x){sh('فشل إرسال الرمز، حاول مرة أخرى',0);b.disabled=0;b.textContent='الحصول على رمز التحقق'}});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();window.openCap(async()=>{const b=document.getElementById('bL');b.disabled=1;b.textContent='جاري تسجيل الدخول...';try{await signInWithEmailAndPassword(auth,lem.value.trim(),lpw.value);sh('تم تسجيل الدخول بنجاح، جاري التحويل...',1);setTimeout(()=>location.replace('index.html'),800)}catch(x){sh(ar(x.code),0);b.disabled=0;b.textContent='تأكيد تسجيل الدخول'}})});document.getElementById('reg').addEventListener('submit',async e=>{e.preventDefault();if(rpw.value!==rpw2.value)return sh('كلمتا المرور غير متطابقتين',0);if(!vc||rcd.value.trim()!==vc)return sh('رمز التحقق غير صحيح',0);if(Date.now()>ve)return sh('انتهت صلاحية رمز التحقق، اطلب رمزًا جديدًا',0);window.openCap(async()=>{const b=document.getElementById('bR');b.disabled=1;b.textContent='جاري إنشاء الحساب...';try{const c=await createUserWithEmailAndPassword(auth,rem.value.trim(),rpw.value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,inviteCode:rinv.value.trim()||null,createdAt:serverTimestamp()});sh('تم إنشاء الحساب بنجاح، جاري التحويل...',1);setTimeout(()=>location.replace('index.html'),800)}catch(x){sh(ar(x.code),0);b.disabled=0;b.textContent='تأكيد التسجيل'}})});document.getElementById('fp').addEventListener('click',async()=>{const em=lem.value.trim();if(!em)return sh('أدخل بريدك الإلكتروني أولًا لإرسال رابط الاستعادة',0);try{await sendPasswordResetEmail(auth,em);sh('تم إرسال رابط استعادة كلمة المرور إلى بريدك',1)}catch(x){sh(ar(x.code),0)}})</script></body></html>
