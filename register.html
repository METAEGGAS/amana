<!DOCTYPE html><html lang="ar" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكمل عملية الدخول</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}body{background:#f7f8fa;min-height:100vh;user-select:none;-webkit-user-select:none}input{user-select:text;-webkit-user-select:text}header{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;text-align:center;padding:9px 0;font-size:16px;font-weight:600}.top-img{display:block;width:60%;max-width:210px;margin:12px auto 0;border-radius:10px}main{background:#fcfcff;min-height:calc(100vh - 38px);padding:14px 18px;display:flex;flex-direction:column}.tabs{display:flex;justify-content:center;gap:60px;font-size:16px;color:#333}.tabs span{padding-bottom:8px;cursor:pointer;color:#888}.tabs span.on{color:#111;font-weight:700;border-bottom:3px solid #6d5ef0}.fld{display:flex;align-items:center;gap:12px;border-bottom:2px solid #e2e2ec;padding:13px 2px 10px;margin-top:10px;transition:border-color .2s}.fld:focus-within{border-color:#6d5ef0}.fld svg{width:23px;height:23px;stroke:#555;fill:none;stroke-width:1.7;flex-shrink:0}.fld input{border:0;outline:0;flex:1;font-size:15px;background:none;color:#333;min-width:0}.fld input::placeholder{color:#bbb}.eye{cursor:pointer}.code-btn{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:20px;padding:8px 12px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}.code-btn.cnt{background:none;color:#1d6ff2;font-weight:700;font-size:14px;padding:8px 4px;opacity:1}.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#555}.chk input{width:16px;height:16px;accent-color:#6d5ef0;cursor:pointer}.chk a,.fp{color:#6d5ef0;text-decoration:none}.fp{display:block;text-align:left;font-size:13px;margin-top:12px;cursor:pointer}.btn{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:10px;border-radius:8px;font-size:13px;text-align:center}.msg.err{display:block;background:#fdecea;color:#c0392b}.msg.ok{display:block;background:#e8f8f0;color:#1e8e5a}.hide{display:none}</style></head><body><header>اكمل عملية الدخول</header><img class="top-img" src="https://i.ibb.co/0jZJCL1z/file-0000000095a081f483ce7ffa4c8f6313.png" alt=""><main><div class="tabs"><span id="tL" onclick="sw(0)">تسجيل الدخول</span><span id="tR" class="on" onclick="sw(1)">تسجيل</span></div><div id="msg" class="msg"></div><form id="login" class="hide" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="lem" type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input id="lpw" type="password" placeholder="يرجى إدخال كلمة المرور" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><label class="chk"><input type="checkbox">تذكرني</label><a class="fp" id="fp">نسيت كلمة السر؟</a><button class="btn" id="bL">تأكيد تسجيل الدخول</button></form><form id="reg" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="rem" type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><input id="rcd" type="text" placeholder="يرجى إدخال رمز التحقق" required><button type="button" class="code-btn" id="cb">الحصول على رمز التحقق</button></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input id="rpw" type="password" placeholder="يرجى إدخال كلمة المرور" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input id="rpw2" type="password" placeholder="يرجى تأكيد كلمة المرور الجديدة" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><circle cx="12" cy="16" r="1.6"/></svg><input id="rinv" type="text" placeholder="يرجى إدخال كود الدعوة"></div><label class="chk"><input type="checkbox" required>أوافق على <a href="#">سياسة الخصوصية</a></label><button class="btn" id="bR">تأكيد التسجيل</button></form></main><script>function sw(n){tL.classList.toggle('on',!n);tR.classList.toggle('on',!!n);login.classList.toggle('hide',!!n);reg.classList.toggle('hide',!n)}function pe(e){var i=e.previousElementSibling;i.type=i.type=='password'?'text':'password'}function go(){return false}try{history.replaceState(null,'','/pages/register/login')}catch(e){}['copy','cut','selectstart','contextmenu'].forEach(function(v){document.addEventListener(v,function(e){if(e.target.tagName!='INPUT')e.preventDefault()})})</script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg",authDomain:"hhhxh-5ebe4.firebaseapp.com",projectId:"hhhxh-5ebe4",storageBucket:"hhhxh-5ebe4.firebasestorage.app",messagingSenderId:"79243000696",appId:"1:79243000696:web:ee0fb2d2ccce791954e68d",measurementId:"G-08BR6LN6PT"});const auth=getAuth(app),db=getFirestore(app),m=document.getElementById('msg');let vc=null,ve=0;function sh(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t}function ar(c){return{'auth/email-already-in-use':'هذا البريد الإلكتروني مسجل من قبل','auth/invalid-email':'البريد الإلكتروني غير صحيح','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/invalid-credential':'البريد الإلكتروني أو كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/wrong-password':'كلمة المرور غير صحيحة','auth/too-many-requests':'محاولات كثيرة، حاول لاحقًا'}[c]||'حدث خطأ، حاول مرة أخرى'}document.getElementById('cb').addEventListener('click',async function(){const em=rem.value.trim();if(!em)return sh('أدخل بريدك الإلكتروني أولًا لإرسال رمز التحقق',0);const b=this;b.disabled=1;b.textContent='جاري الإرسال...';try{const s=await getDoc(doc(db,'smtp','smtpsjjsjs'));const key=s.data().smtp;vc=(''+Math.floor(1e6+Math.random()*9e6));ve=Date.now()+6e4;const r=await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':key,'Content-Type':'application/json'},body:JSON.stringify({sender:{name:'Eptinex',email:'noreply.eptinex@gmail.com'},to:[{email:em}],subject:'رمز التحقق',htmlContent:'<div dir="rtl" style="font-family:Arial;text-align:center"><h2>رمز التحقق الخاص بك</h2><p style="font-size:32px;font-weight:700;letter-spacing:6px;color:#6d5ef0">'+vc+'</p><p>الرمز صالح لمدة 60 ثانية فقط</p></div>'})});if(!r.ok)throw 0;sh('تم إرسال رمز التحقق إلى بريدك (صالح لمدة 60 ثانية)',1);let sec=60;b.classList.add('cnt');b.textContent='60S';const t=setInterval(()=>{sec--;if(sec>0)b.textContent=sec+'S';else{clearInterval(t);b.textContent='الحصول على رمز التحقق';b.disabled=0;b.classList.remove('cnt')}},1e3)}catch(x){sh('فشل إرسال الرمز، حاول مرة أخرى',0);b.disabled=0;b.textContent='الحصول على رمز التحقق'}});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('bL');b.disabled=1;b.textContent='جاري تسجيل الدخول...';try{await signInWithEmailAndPassword(auth,lem.value.trim(),lpw.value);sh('تم تسجيل الدخول بنجاح، جاري التحويل...',1);setTimeout(()=>location.href='index.html',800)}catch(x){sh(ar(x.code),0);b.disabled=0;b.textContent='تأكيد تسجيل الدخول'}});document.getElementById('reg').addEventListener('submit',async e=>{e.preventDefault();if(rpw.value!==rpw2.value)return sh('كلمتا المرور غير متطابقتين',0);if(!vc||rcd.value.trim()!==vc)return sh('رمز التحقق غير صحيح',0);if(Date.now()>ve)return sh('انتهت صلاحية رمز التحقق، اطلب رمزًا جديدًا',0);const b=document.getElementById('bR');b.disabled=1;b.textContent='جاري إنشاء الحساب...';try{const c=await createUserWithEmailAndPassword(auth,rem.value.trim(),rpw.value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,inviteCode:rinv.value.trim()||null,createdAt:serverTimestamp()});sh('تم إنشاء الحساب بنجاح، جاري التحويل...',1);setTimeout(()=>location.href='index.html',800)}catch(x){sh(ar(x.code),0);b.disabled=0;b.textContent='تأكيد التسجيل'}});document.getElementById('fp').addEventListener('click',async()=>{const em=lem.value.trim();if(!em)return sh('أدخل بريدك الإلكتروني أولًا لإرسال رابط الاستعادة',0);try{await sendPasswordResetEmail(auth,em);sh('تم إرسال رابط استعادة كلمة المرور إلى بريدك',1)}catch(x){sh(ar(x.code),0)}})</script></body></html>
