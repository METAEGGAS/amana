<!DOCTYPE html><html lang="ar" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكمل عملية الدخول</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}body{background:#f7f8fa;min-height:100vh}header{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;text-align:center;padding:10px 0;font-size:17px;font-weight:600}main{background:#fcfcff;min-height:calc(100vh - 39px);padding:26px 22px 0;display:flex;flex-direction:column}.tabs{display:flex;justify-content:center;gap:60px;font-size:17px;color:#333}.tabs span{padding-bottom:10px;cursor:pointer;color:#888}.tabs span.on{color:#111;font-weight:600;border-bottom:3px solid #111}.fld{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e6e6e6;padding:20px 0 14px;margin-top:14px}.fld svg{width:24px;height:24px;stroke:#555;fill:none;stroke-width:1.6;flex-shrink:0}.fld input{border:0;outline:0;flex:1;font-size:15px;background:none;color:#333}.fld input::placeholder{color:#bbb}.eye{cursor:pointer}.code-btn{background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:24px;padding:8px 12px;font-size:11px;cursor:pointer;white-space:nowrap}.chk{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:#555}.chk input{width:16px;height:16px;accent-color:#6d5ef0;cursor:pointer}.chk a{color:#6d5ef0;text-decoration:none}.btn{display:block;width:100%;margin-top:40px;background:linear-gradient(135deg,#6d5ef0,#8a7bf7);color:#fff;border:0;border-radius:8px;padding:16px;font-size:17px;cursor:pointer}.btm-img{display:block;width:calc(100% + 44px);margin:auto -22px 0}.hide{display:none}</style></head><body><header>اكمل عملية الدخول</header><main><div class="tabs"><span id="tL" onclick="sw(0)">تسجيل الدخول</span><span id="tR" class="on" onclick="sw(1)">تسجيل</span></div><form id="login" class="hide" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input type="password" placeholder="يرجى إدخال كلمة المرور" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><label class="chk"><input type="checkbox">تذكرني</label><button class="btn">تأكيد تسجيل الدخول</button></form><form id="reg" onsubmit="return go()"><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" placeholder="يرجى إدخال البريد الإلكتروني" required></div><div class="fld"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><input type="text" placeholder="يرجى إدخال رمز التحقق" required><button type="button" class="code-btn">الحصول على رمز التحقق</button></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><circle cx="12" cy="16" r="1.6"/></svg><input type="text" placeholder="يرجى إدخال كود الدعوة"></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input type="password" placeholder="يرجى إدخال كلمة المرور" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg><input type="password" placeholder="يرجى تأكيد كلمة المرور الجديدة" required><svg class="eye" viewBox="0 0 24 24" onclick="pe(this)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></div><label class="chk"><input type="checkbox" required>أوافق على <a href="#">سياسة الخصوصية</a></label><button class="btn">تأكيد التسجيل</button></form><img class="btm-img" src="https://i.ibb.co/0jZJCL1z/file-0000000095a081f483ce7ffa4c8f6313.png" alt=""></main><script>function sw(n){tL.classList.toggle('on',!n);tR.classList.toggle('on',n);login.classList.toggle('hide',n);reg.classList.toggle('hide',!n)}function pe(e){var i=e.previousElementSibling;i.type=i.type=='password'?'text':'password'}function go(){return false}</script></body></html>
