<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0e14; color: #e6edf5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #151e2a; padding: 1rem; text-align: center; border-bottom: 1px solid #2a3a4a; }
        .header h1 { color: #4a9eff; font-size: 1.5rem; }
        .chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 16px; line-height: 1.5; word-wrap: break-word; }
        .message.user { align-self: flex-start; background: #4a9eff; color: #fff; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-end; background: #1e2a36; color: #e6edf5; border-bottom-left-radius: 4px; border: 1px solid #2a3a4a; }
        .message.system { align-self: center; background: #2a1a1a; color: #ff6b6b; font-size: 0.8rem; padding: 0.5rem 1rem; border-radius: 20px; }
        .input-area { display: flex; gap: 0.5rem; padding: 1rem; background: #151e2a; border-top: 1px solid #2a3a4a; }
        .input-area input { flex: 1; background: #0e1620; border: 1px solid #2a3a4a; color: #e6edf5; padding: 0.8rem 1rem; border-radius: 12px; outline: none; }
        .input-area input:focus { border-color: #4a9eff; }
        .input-area button { background: #4a9eff; color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 12px; cursor: pointer; font-weight: 700; }
        .input-area button:hover { background: #3a8eef; }
        .input-area button:disabled { background: #2a3a4a; cursor: not-allowed; }
        .typing { display: none; align-self: flex-end; background: #1e2a36; padding: 0.8rem 1.2rem; border-radius: 16px; border-bottom-left-radius: 4px; }
        .typing span { display: inline-block; width: 8px; height: 8px; background: #4a9eff; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .api-key-area { display: flex; gap: 0.5rem; padding: 0.5rem 1rem; background: #0e1620; border-bottom: 1px solid #2a3a4a; }
        .api-key-area input { flex: 1; background: #151e2a; border: 1px solid #2a3a4a; color: #e6edf5; padding: 0.5rem; border-radius: 8px; font-size: 0.8rem; }
        .api-key-area button { background: #2a3a4a; color: #e6edf5; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>🤖 DeepSeek Chat</h1>
</div>

<div class="api-key-area">
    <input type="password" id="apiKey" placeholder="أدخل مفتاح DeepSeek API هنا..." value="">
    <button onclick="saveKey()">حفظ</button>
</div>

<div class="chat-container" id="chat">
    <div class="message system">مرحباً! أنا DeepSeek. كيف يمكنني مساعدتك؟</div>
</div>

<div class="typing" id="typing">
    <span></span><span></span><span></span>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">إرسال</button>
</div>

<script>
    const API_URL = 'https://api.deepseek.com/chat/completions';
    let messages = [];
    let apiKey = '';

    // استرجاع المفتاح من localStorage
    window.onload = function() {
        const savedKey = localStorage.getItem('deepseek_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            apiKey = savedKey;
        }
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (!key) {
            addMessage('system', '❌ يرجى إدخال مفتاح API أولاً.');
            return;
        }
        apiKey = key;
        localStorage.setItem('deepseek_api_key', key);
        addMessage('system', '✅ تم حفظ مفتاح API بنجاح.');
    }

    function addMessage(role, content) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function showTyping(show) {
        document.getElementById('typing').style.display = show ? 'block' : 'none';
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        if (!apiKey) {
            addMessage('system', '❌ يرجى إدخال مفتاح API أولاً.');
            return;
        }

        // إضافة رسالة المستخدم
        addMessage('user', text);
        messages.push({ role: 'user', content: text });
        input.value = '';

        // تعطيل الزر
        document.getElementById('sendBtn').disabled = true;
        showTyping(true);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: messages,
                    stream: false
                })
            });

            const data = await response.json();

            if (data.error) {
                addMessage('system', `❌ خطأ: ${data.error.message}`);
            } else {
                const reply = data.choices[0].message.content;
                addMessage('ai', reply);
                messages.push({ role: 'assistant', content: reply });
            }
        } catch (e) {
            addMessage('system', `❌ خطأ في الاتصال: ${e.message}`);
        } finally {
            document.getElementById('sendBtn').disabled = false;
            showTyping(false);
        }
    }
</script>

</body>
</html>
