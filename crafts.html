<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>صفحتي</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#2b0a4a;min-height:100vh}.w{max-width:430px;margin:0 auto}.hd{position:relative;background:#3d0f66;border-radius:0 0 30px 30px;padding:16px 14px 0}.hero{position:relative;z-index:2}.hero img{display:block;width:86%;max-width:330px;margin:0 auto;object-fit:contain}.row{display:flex;direction:ltr;gap:10px;padding:6px 14px 0}.row button{flex:1;background:#fff;border:none;border-radius:16px;padding:15px 4px;font-size:15px;font-weight:700;color:#0d0d0d;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.15s}.row button:active{transform:scale(.97);background:#ececec}.cd{background:#3d0f66;border-radius:22px;margin:14px;padding:16px}.cl{width:100%;background:#c8f31d;border:none;border-radius:16px;padding:18px;font-size:19px;font-weight:800;color:#0d0d0d;cursor:pointer;transition:.15s}.cl:active{transform:scale(.98);background:#b4dc12}.log{padding:6px 14px 30px}.log h3{font-size:14px;color:#d0b3ff;margin-bottom:9px}.lb{background:#3d0f66;border-radius:16px;padding:34px 18px;text-align:center;color:#b090d0;font-size:15px}.drop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #5a2a8a;color:#fff;font-size:14px;direction:rtl}.drop .info{display:flex;flex-direction:column;gap:4px}.drop .info b{color:#c8f31d;font-weight:800}.drop .info span{color:#d0b3ff;font-size:12px}.drop button{background:#c8f31d;border:none;border-radius:10px;padding:8px 14px;font-weight:800;color:#0d0d0d;cursor:pointer;font-size:13px}.drop button:active{transform:scale(.95)}</style></head><body><div class="w"><div class="hd"><div class="hero"><img src="https://i.ibb.co/Y4Wq6Pzx/IMG.png" alt="أيقونة"></div></div><div class="row"><button onclick="addLog('العمليات')">★ العمليات</button><button onclick="addLog('ارسال دروب')">👤 ارسال دروب</button><button onclick="addDrop()">🎁 دروب</button></div><div class="cd"><button class="cl" onclick="addLog('انزال الدروب 6,755 $LOON')">انزال الدروب 6,755 $LOON</button></div><div class="log"><h3>السجل</h3><div class="lb" id="logBox">نو داتا</div></div></div><script>function ready(b){if(b.textContent==='نو داتا'){b.innerHTML='';b.style.padding='16px 18px';b.style.textAlign='right';b.style.color='#fff'}}function addLog(t){var b=document.getElementById('logBox');ready(b);var d=new Date().toLocaleTimeString('ar');var e=document.createElement('div');e.style.cssText='padding:10px 0;border-bottom:1px solid #5a2a8a;color:#fff;font-size:15px';e.textContent='• '+t+' — '+d;b.appendChild(e)}function addDrop(){var b=document.getElementById('logBox');ready(b);var d=new Date().toLocaleTimeString('ar');var n=(Math.floor(Math.random()*9000)+1000);var e=document.createElement('div');e.className='drop';e.innerHTML='<div class="info"><b>+ '+n.toLocaleString()+' $LOON</b><span>صفقة دروب فعلي — '+d+'</span></div><button onclick="claim(this)">انزال</button>';b.appendChild(e)}function claim(btn){btn.textContent='تم';btn.style.background='#5a2a8a';btn.style.color='#fff';btn.disabled=true;addLog('تم انزال الدروب بنجاح')}</script></body></html>
