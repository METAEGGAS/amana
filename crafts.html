function switchTab(t){currentTab=t;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.tab-btn[data-tab="${t}"]`).classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));const el=document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1));if(el)el.classList.add('active')}
function fmtDate(v){if(!v)return'—';if(typeof v==='object'&&v.seconds)return new Date(v.seconds*1000).toLocaleString('ar-EG');if(typeof v==='number')return new Date(v).toLocaleString('ar-EG');if(typeof v==='string'&&v.length>8){const d=new Date(v);if(!isNaN(d))return d.toLocaleString('ar-EG');return v}return'—'}
function toMs(v){if(!v)return 0;if(typeof v==='object'&&v.seconds)return v.seconds*1000;if(typeof v==='number')return v;if(typeof v==='string'){const d=new Date(v);if(!isNaN(d))return d.getTime()}return 0}
function fmtDay(v){const ms=toMs(v);if(!ms)return'';return new Date(ms).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtTime(v){const ms=toMs(v);if(!ms)return'';return new Date(ms).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rv(v){if(v==null)return'<span style="color:#64748b">—</span>';if(typeof v==='boolean')return v?'<span style="color:#4ade80">✅</span>':'<span style="color:#f87171">❌</span>';if(typeof v==='object'&&v.seconds)return new Date(v.seconds*1000).toLocaleString('ar-EG');if(Array.isArray(v)){if(v.length===0)return'<span style="color:#64748b">[]</span>';return v.map((i,idx)=>typeof i==='object'?`<details><summary style="cursor:pointer;color:#f97316">عنصر ${idx+1}</summary><pre style="font-size:10px;color:#94a3b8;margin:4px 0;white-space:pre-wrap">${esc(JSON.stringify(i,null,2))}</pre></details>`:esc(String(i))).join(', ')}if(typeof v==='object')return`<pre style="font-size:10px;color:#94a3b8;margin:0;white-space:pre-wrap;direction:ltr;text-align:left">${esc(JSON.stringify(v,null,2))}</pre>`;if(typeof v==='string'&&v.startsWith('http'))return`<a href="${esc(v)}" target="_blank">${esc(v.length>50?v.substring(0,50)+'...':v)}</a>`;return esc(String(v))}

async function loadAllData(){if(loading)return;loading=true;const btn=document.getElementById('loadBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';try{
const[uS,dS,tS,bS,nS,mS]=await Promise.all([db.collection('users').get(),db.collection('deposits').get(),db.collection('transactions').get(),db.collection('broadcasts').get(),db.collection('notifications').get(),db.collection('support_messages').get()]);
allUsers=[];uS.forEach(d=>allUsers.push({id:d.id,...d.data()}));
allDeposits=[];dS.forEach(d=>allDeposits.push({id:d.id,...d.data()}));
allTransactions=[];tS.forEach(d=>allTransactions.push({id:d.id,...d.data()}));
allWithdrawals=allTransactions.filter(t=>gf(t,'type')==='withdrawal');
allBroadcasts=[];bS.forEach(d=>allBroadcasts.push({id:d.id,...d.data()}));
allNotifications=[];nS.forEach(d=>allNotifications.push({id:d.id,...d.data()}));
allMessages=[];mS.forEach(d=>allMessages.push({id:d.id,...d.data()}));
fU=allUsers;fD=allDeposits;fT=allTransactions;fW=allWithdrawals;fB=allBroadcasts;fN=allNotifications;fM=allMessages;
renderUsers(fU);renderDeposits(fD);renderTransactions(fT);renderWithdrawals(fW);renderBroadcasts(fB);renderNotificationsGrouped(fN);renderMessagesGrouped(fM);renderPrograms();
updateStats();
showToast(`✅ ${allUsers.length}👥 ${allDeposits.length}📥 ${allTransactions.length}💱`,'success');
if(chatCtx)openChat(chatCtx.type,chatCtx.userId,true);
}catch(e){showToast(`❌ ${e.message}`,'error');console.error(e);document.getElementById('connectionStatus').className='badge-status badge-error';document.getElementById('connectionStatus').innerHTML='<i class="fas fa-circle" style="font-size:8px;color:#f87171"></i> خطأ'}loading=false;btn.disabled=false;btn.innerHTML='<i class="fas fa-download"></i> تحميل'}

function renderUsers(users){const c=document.getElementById('usersContainer');if(!users||!users.length){c.innerHTML='<div class="empty"><div class="icon">👥</div><div>لا يوجد</div></div>';return}let h=`<table><thead><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الدور</th><th>الرصيد</th><th>مستثمر</th><th>الأرباح</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>`;
users.forEach((u,i)=>{const docId=u.id;const name=gf(u,'name','displayName','username','fullName')||'—';const email=getEmail(u);const phone=gf(u,'phone','phoneNumber','mobile')||'—';const role=gf(u,'role')||'user';const balance=Number(gf(u,'balance','wallet')||0);const invested=Number(gf(u,'invested','totalInvested')||0);const profit=Number(gf(u,'profit','earnings')||0);const isBlocked=gf(u,'isBlocked','banned');const isDeleted=gf(u,'isDeleted','deleted');const rc=role==='admin'?'badge-admin':'badge-user';const sc=isBlocked?'badge-banned':isDeleted?'badge-suspended':'badge-active';const status=isBlocked?'محظور':isDeleted?'محذوف':'نشط';
h+=`<tr><td>${i+1}</td><td><strong>${esc(name)}</strong></td><td style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>20?email.substring(0,20)+'…':email)}</td><td style="font-size:10px">${esc(phone)}</td><td><span class="badge ${rc}">${esc(role)}</span></td><td style="color:#f97316;font-weight:600">$${balance.toFixed(2)}</td><td style="color:#60a5fa">$${invested.toFixed(2)}</td><td style="color:#22c55e">$${profit.toFixed(2)}</td><td><span class="badge ${sc}">${status}</span></td><td style="white-space:nowrap"><button class="btn btn-primary btn-sm" onclick="showUserDetails('${docId}')"><i class="fas fa-cog"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderDeposits(deposits){const c=document.getElementById('depositsContainer');if(!deposits||!deposits.length){c.innerHTML='<div class="empty"><div class="icon">📥</div><div>لا توجد</div></div>';return}let h=`<table><thead><tr><th>#</th><th>البريد</th><th>amount</th><th>status</th><th>createdAt</th><th>إجراءات</th></tr></thead><tbody>`;deposits.forEach((d,i)=>{const status=gf(d,'status')||'pending';const sc=status==='pending'?'badge-pending':status==='credited'?'badge-credited':status==='completed'?'badge-completed':status==='failed'?'badge-failed':status==='rejected'?'badge-rejected':'';const userId=gf(d,'userId','uid')||'—';const u=allUsers.find(x=>x.id===userId||gf(x,'uid')===userId);const email=u?getEmail(u):'—';const amount=Number(gf(d,'amount')||0);const created=gf(d,'createdAt');h+=`<tr><td>${i+1}</td><td style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>18?email.substring(0,18)+'…':email)}</td><td style="color:#f97316;font-weight:600">$${amount}</td><td><span class="badge ${sc}">${esc(status)}</span></td><td style="font-size:9px">${fmtDate(created)}</td><td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="showDocDetails('deposits','${d.id}')"><i class="fas fa-eye"></i></button> <button class="btn btn-primary btn-sm" onclick="editDeposit('${d.id}')"><i class="fas fa-edit"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteDoc('deposits','${d.id}')"><i class="fas fa-trash"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderTransactions(txs){const c=document.getElementById('transactionsContainer');if(!txs||!txs.length){c.innerHTML='<div class="empty"><div class="icon">💱</div><div>لا توجد</div></div>';return}let h=`<table><thead><tr><th>#</th><th>البريد</th><th>amount</th><th>type</th><th>status</th><th>createdAt</th><th>إجراءات</th></tr></thead><tbody>`;txs.forEach((t,i)=>{const status=gf(t,'status')||'pending';const sc=status==='pending'?'badge-pending':status==='completed'?'badge-completed':status==='credited'?'badge-credited':status==='failed'?'badge-failed':'';const type=gf(t,'type')||'deposit';const tc=type==='withdrawal'?'badge-withdrawal':'badge-deposit';const userId=gf(t,'userId','uid')||'—';const u=allUsers.find(x=>x.id===userId||gf(x,'uid')===userId);const email=u?getEmail(u):'—';const amount=Number(gf(t,'amount')||0);h+=`<tr><td>${i+1}</td><td style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>18?email.substring(0,18)+'…':email)}</td><td style="color:#f97316;font-weight:600">$${amount}</td><td><span class="badge ${tc}">${esc(type)}</span></td><td><span class="badge ${sc}">${esc(status)}</span></td><td style="font-size:9px">${fmtDate(gf(t,'createdAt'))}</td><td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="showDocDetails('transactions','${t.id}')"><i class="fas fa-eye"></i></button> <button class="btn btn-primary btn-sm" onclick="editTransaction('${t.id}')"><i class="fas fa-edit"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteDoc('transactions','${t.id}')"><i class="fas fa-trash"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderWithdrawals(wds){const c=document.getElementById('withdrawalsContainer');if(!wds||!wds.length){c.innerHTML='<div class="empty"><div class="icon">📤</div><div>لا توجد</div></div>';return}let h=`<table><thead><tr><th>#</th><th>البريد</th><th>amount</th><th>status</th><th>عنوان</th><th>createdAt</th><th>إجراءات</th></tr></thead><tbody>`;wds.forEach((w,i)=>{const status=gf(w,'status')||'pending';const sc=status==='pending'?'badge-pending':status==='completed'?'badge-completed':status==='failed'?'badge-failed':'';const userId=gf(w,'userId','uid')||'—';const u=allUsers.find(x=>x.id===userId||gf(x,'uid')===userId);const email=u?getEmail(u):'—';const amount=Number(gf(w,'amount')||0);const wdAddr=gf(w,'withdrawAddress','address','wallet')||'—';h+=`<tr><td>${i+1}</td><td style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>18?email.substring(0,18)+'…':email)}</td><td style="color:#f97316;font-weight:600">$${amount}</td><td><span class="badge ${sc}">${esc(status)}</span></td><td style="font-size:9px" title="${esc(wdAddr)}">${esc(String(wdAddr).substring(0,14))}…</td><td style="font-size:9px">${fmtDate(gf(w,'createdAt'))}</td><td style="white-space:nowrap"><button class="btn btn-success btn-sm" onclick="approveWithdrawal('${w.id}')" title="موافقة"><i class="fas fa-check"></i></button> <button class="btn btn-danger btn-sm" onclick="rejectWithdrawal('${w.id}')" title="رفض"><i class="fas fa-times"></i></button> <button class="btn btn-primary btn-sm" onclick="editTransaction('${w.id}')"><i class="fas fa-edit"></i></button> <button class="btn btn-secondary btn-sm" onclick="deleteDoc('transactions','${w.id}')"><i class="fas fa-trash"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderBroadcasts(bcs){const c=document.getElementById('broadcastsContainer');if(!bcs||!bcs.length){c.innerHTML='<div class="empty"><div class="icon">📢</div><div>لا توجد</div></div>';return}let h=`<table><thead><tr><th>#</th><th>title</th><th>message</th><th>createdAt</th><th>إجراءات</th></tr></thead><tbody>`;bcs.forEach((b,i)=>{const title=gf(b,'title')||'—';const msg=gf(b,'message','content','body')||'—';h+=`<tr><td>${i+1}</td><td><strong>${esc(title)}</strong></td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(String(msg).substring(0,80))}</td><td style="font-size:9px">${fmtDate(gf(b,'createdAt'))}</td><td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="showDocDetails('broadcasts','${b.id}')"><i class="fas fa-eye"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteDoc('broadcasts','${b.id}')"><i class="fas fa-trash"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderNotificationsGrouped(nts){const c=document.getElementById('notificationsContainer');if(!nts||!nts.length){c.innerHTML='<div class="empty"><div class="icon">🔔</div><div>لا توجد</div></div>';return}const map={};nts.forEach(n=>{const uid=gf(n,'userId','uid')||'unknown';if(!map[uid])map[uid]={items:[],last:0,unread:0};map[uid].items.push(n);const ms=toMs(gf(n,'createdAt'));if(ms>map[uid].last)map[uid].last=ms;if(!gf(n,'isRead','read'))map[uid].unread++});const list=Object.entries(map).sort((a,b)=>b[1].last-a[1].last);let h=`<table><thead><tr><th>#</th><th>المستخدم</th><th>البريد</th><th>عدد</th><th>غير مقروء</th><th>آخر</th><th>إجراءات</th></tr></thead><tbody>`;list.forEach(([uid,g],i)=>{const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const name=u?(gf(u,'name','displayName','username')||uid):uid;const email=u?getEmail(u):'—';h+=`<tr style="cursor:pointer"><td>${i+1}</td><td onclick="openChat('notifications','${esc(uid)}')"><strong>${esc(String(name).substring(0,20))}</strong></td><td onclick="openChat('notifications','${esc(uid)}')" style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>18?email.substring(0,18)+'…':email)}</td><td style="text-align:center"><span class="badge badge-user">${g.items.length}</span></td><td style="text-align:center">${g.unread>0?'<span class="badge badge-pending">'+g.unread+'</span>':'<span style="color:#4ade80">✓</span>'}</td><td style="font-size:9px">${fmtDate(g.last)}</td><td style="white-space:nowrap"><button class="btn btn-primary btn-sm" onclick="openChat('notifications','${esc(uid)}')"><i class="fas fa-comments"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderMessagesGrouped(msgs){const c=document.getElementById('messagesContainer');if(!msgs||!msgs.length){c.innerHTML='<div class="empty"><div class="icon">💬</div><div>لا توجد</div></div>';return}const map={};msgs.forEach(m=>{const uid=gf(m,'userId','uid')||'unknown';if(!map[uid])map[uid]={items:[],last:0,unread:0,name:null,email:null};map[uid].items.push(m);const ms=toMs(gf(m,'createdAt'));if(ms>map[uid].last)map[uid].last=ms;if(!gf(m,'isRead','read')&&gf(m,'sender','from')==='user')map[uid].unread++;if(!map[uid].name)map[uid].name=gf(m,'userName','name');if(!map[uid].email)map[uid].email=gf(m,'userEmail','email')});const list=Object.entries(map).sort((a,b)=>b[1].last-a[1].last);let h=`<table><thead><tr><th>#</th><th>المستخدم</th><th>البريد</th><th>عدد</th><th>غير مقروء</th><th>آخر</th><th>إجراءات</th></tr></thead><tbody>`;list.forEach(([uid,g],i)=>{const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const name=g.name||(u?(gf(u,'name','displayName')||uid):uid);const email=g.email||(u?getEmail(u):'—');h+=`<tr style="cursor:pointer"><td>${i+1}</td><td onclick="openChat('support','${esc(uid)}')"><strong>${esc(String(name).substring(0,20))}</strong></td><td onclick="openChat('support','${esc(uid)}')" style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email.length>18?email.substring(0,18)+'…':email)}</td><td style="text-align:center"><span class="badge badge-user">${g.items.length}</span></td><td style="text-align:center">${g.unread>0?'<span class="badge badge-pending">'+g.unread+'</span>':'<span style="color:#4ade80">✓</span>'}</td><td style="font-size:9px">${fmtDate(g.last)}</td><td style="white-space:nowrap"><button class="btn btn-primary btn-sm" onclick="openChat('support','${esc(uid)}')"><i class="fas fa-comments"></i></button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderPrograms(){const c=document.getElementById('programsContainer');let h='<div style="padding:12px">';PROGRAMS.forEach((p,idx)=>{h+=`<div class="prog-card"><div><div class="prog-name">${idx+1}. ${esc(p.nameAr)}</div><div style="font-size:10px;color:#64748b;margin-top:2px">${esc(p.nameEn)} · <code style="color:#f97316">${esc(p.id)}</code></div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="prog-cost">$${p.cost}</span><span style="font-size:10px;color:#22c55e">+$${p.dailyProfit}/يوم</span><span style="font-size:10px;color:#94a3b8">${p.duration}ي</span></div></div>`});h+='</div>';c.innerHTML=h}

/* ===== CHAT ===== */
function openChat(type,userId,keepScroll){chatCtx={type,userId};const u=allUsers.find(x=>x.id===userId||gf(x,'uid')===userId);const items=(type==='support'?allMessages:allNotifications).filter(x=>gf(x,'userId','uid')===userId);items.sort((a,b)=>toMs(gf(a,'createdAt'))-toMs(gf(b,'createdAt')));
let name='مستخدم',email='—',phone='—';if(u){name=gf(u,'name','displayName','username')||userId;email=getEmail(u);phone=gf(u,'phone','phoneNumber','mobile')||'—'}else if(items.length){name=gf(items[0],'userName','name')||userId;phone=gf(items[0],'userPhone','phone')||'—';email=gf(items[0],'userEmail','email')||'—'}
document.getElementById('chatName').textContent=name;document.getElementById('chatMeta').textContent=`${email} · ${phone}`;document.getElementById('chatAvatar').textContent=(name||'?').charAt(0).toUpperCase();
document.getElementById('chatToolbar').innerHTML=`<span><b>UID:</b> <code style="direction:ltr">${esc(String(userId).substring(0,20))}${String(userId).length>20?'…':''}</code></span><span>·</span><span><b>${type==='support'?'💬 دعم':'🔔 إشعارات'}</b></span><span>·</span><span><b>${items.length}</b></span>`;
const body=document.getElementById('chatBody');const prevScroll=body.scrollTop;const wasBottom=body.scrollHeight-body.scrollTop-body.clientHeight<50;
if(!items.length){body.innerHTML='<div class="chat-empty">💭 لا رسائل بعد</div>'}else{let h='',lastDay='';items.forEach(m=>{const ts=gf(m,'createdAt');const day=fmtDay(ts);if(day&&day!==lastDay){h+=`<div class="chat-date-sep">${day}</div>`;lastDay=day}const sender=gf(m,'sender','from')||(type==='notifications'?'admin':'user');const isAdmin=sender==='admin'||sender==='manager'||sender==='system';const text=type==='support'?(gf(m,'text','message','content')||''):((gf(m,'title')?'📌 '+gf(m,'title')+'\n':'')+(gf(m,'message','content','body')||''));const read=gf(m,'isRead','read');h+=`<div class="msg ${isAdmin?'msg-admin':'msg-user'}"><div>${esc(text).replace(/\n/g,'<br>')}</div><div class="meta"><span>${fmtTime(ts)} ${isAdmin?'· '+esc(sender):''} ${read?'✓✓':''}</span><button class="msg-del" onclick="deleteMsg('${type==='support'?'support_messages':'notifications'}','${m.id}')"><i class="fas fa-trash"></i></button></div></div>`});body.innerHTML=h}
document.getElementById('chatModal').style.display='block';if(keepScroll&&!wasBottom){body.scrollTop=prevScroll}else{setTimeout(()=>{body.scrollTop=body.scrollHeight},50)}
if(type==='support'){items.forEach(m=>{if(!gf(m,'isRead','read')&&gf(m,'sender','from')==='user')db.collection('support_messages').doc(m.id).update({isRead:true}).catch(()=>{})})}else{items.forEach(m=>{if(!gf(m,'isRead','read'))db.collection('notifications').doc(m.id).update({isRead:true}).catch(()=>{})})}}

function closeChat(){document.getElementById('chatModal').style.display='none';chatCtx=null}

async function sendChatMsg(){if(!chatCtx)return;const box=document.getElementById('chatInputBox');const text=box.value.trim();if(!text){showToast('⚠️ اكتب رسالة','error');return}const btn=document.getElementById('chatSendBtn');btn.disabled=true;try{const u=allUsers.find(x=>x.id===chatCtx.userId||gf(x,'uid')===chatCtx.userId);const uName=u?(gf(u,'name','displayName','username')||chatCtx.userId):chatCtx.userId;const uPhone=u?(gf(u,'phone','phoneNumber','mobile')||''):'';const uEmail=u?getEmail(u):'';if(chatCtx.type==='support'){const doc={userId:chatCtx.userId,userName:uName,userPhone:uPhone,userEmail:uEmail,text,sender:'admin',isRead:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('support_messages').add(doc);allMessages.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}})}else{const doc={userId:chatCtx.userId,title:'رسالة من الإدارة',message:text,type:'admin',isRead:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('notifications').add(doc);allNotifications.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}})}box.value='';box.style.height='38px';showToast('✅ أُرسلت','success');openChat(chatCtx.type,chatCtx.userId);if(chatCtx.type==='support'){fM=allMessages;renderMessagesGrouped(fM)}else{fN=allNotifications;renderNotificationsGrouped(fN)}updateStats()}catch(e){showToast('❌ '+e.message,'error')}btn.disabled=false}

async function deleteMsg(col,id){if(!confirm('حذف هذه الرسالة؟'))return;try{await db.collection(col).doc(id).delete();if(col==='support_messages'){allMessages=allMessages.filter(m=>m.id!==id);fM=allMessages;renderMessagesGrouped(fM)}else{allNotifications=allNotifications.filter(n=>n.id!==id);fN=allNotifications;renderNotificationsGrouped(fN)}if(chatCtx)openChat(chatCtx.type,chatCtx.userId);updateStats();showToast('🗑️ حُذفت','success')}catch(e){showToast('❌ '+e.message,'error')}}

async function deleteAllChat(){if(!chatCtx)return;if(!confirm('حذف كل رسائل هذه المحادثة؟'))return;const col=chatCtx.type==='support'?'support_messages':'notifications';const arr=chatCtx.type==='support'?allMessages:allNotifications;const items=arr.filter(x=>gf(x,'userId','uid')===chatCtx.userId);try{const batch=db.batch();items.forEach(x=>batch.delete(db.collection(col).doc(x.id)));await batch.commit();if(chatCtx.type==='support'){allMessages=allMessages.filter(m=>gf(m,'userId','uid')!==chatCtx.userId);fM=allMessages;renderMessagesGrouped(fM)}else{allNotifications=allNotifications.filter(n=>gf(n,'userId','uid')!==chatCtx.userId);fN=allNotifications;renderNotificationsGrouped(fN)}openChat(chatCtx.type,chatCtx.userId);updateStats();showToast(`🗑️ ${items.length}`,'success')}catch(e){showToast('❌ '+e.message,'error')}}

function showDocDetails(type,id){const arr=type==='deposits'?allDeposits:type==='transactions'?allTransactions:type==='broadcasts'?allBroadcasts:type==='notifications'?allNotifications:allMessages;const doc=arr.find(d=>d.id===id);if(!doc){showToast('❌ غير موجود','error');return}document.getElementById('modalTitle').textContent=`📄 ${type} · ${id.substring(0,10)}`;let h=`<div class="modal-section"><div class="modal-section-title"><span>📋 الحقول</span><button class="copy-btn" onclick="copyJSON('${type}','${id}')"><i class="fas fa-copy"></i></button></div>`;Object.keys(doc).forEach(k=>{h+=`<div class="modal-field"><div class="modal-field-k">${esc(k)}</div><div class="modal-field-v">${rv(doc[k])}</div></div>`});h+=`</div><div class="modal-section"><div class="modal-section-title">🔧 JSON</div><div class="modal-raw">${esc(JSON.stringify(doc,null,2))}</div></div>`;document.getElementById('modalContent').innerHTML=h;document.getElementById('userModal').style.display='block'}

function closeModal(){document.getElementById('userModal').style.display='none'}
function closeGeneric(){document.getElementById('genericModal').style.display='none'}

function copyJSON(type,id){const arr=type==='users'?allUsers:type==='deposits'?allDeposits:type==='transactions'?allTransactions:type==='broadcasts'?allBroadcasts:type==='notifications'?allNotifications:allMessages;const doc=arr.find(d=>d.id===id);if(doc)navigator.clipboard.writeText(JSON.stringify(doc,null,2)).then(()=>showToast('✅ نُسخ','success')).catch(()=>showToast('❌','error'))}

/* ===== EDIT FUNCTIONS ===== */
async function editNumField(uid,field,label){const u=allUsers.find(x=>x.id===uid);if(!u)return;const cur=Number(gf(u,field)||0);const html=`<div class="edit-form"><label>${label} الحالي: <strong style="color:#f97316">$${cur}</strong></label><label>القيمة الجديدة</label><input type="number" step="0.01" id="editVal" value="${cur}"><label>أو (+/-) لتعديل نسبي</label><input type="number" step="0.01" id="editDelta" placeholder="مثال: 100 أو -50"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveNumField('${uid}','${field}','${label}')"><i class="fas fa-save"></i> حفظ</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric(`✏️ تعديل ${label}`,html)}
async function saveNumField(uid,field,label){const val=document.getElementById('editVal').value;const delta=document.getElementById('editDelta').value;const u=allUsers.find(x=>x.id===uid);if(!u)return;const cur=Number(gf(u,field)||0);let newVal;if(delta!==''&&!isNaN(Number(delta))){newVal=cur+Number(delta)}else if(val!==''){newVal=Number(val)}else{showToast('⚠️ أدخل قيمة','error');return}try{await db.collection('users').doc(uid).update({[field]:newVal});u[field]=newVal;showToast(`✅ ${label}: $${newVal}`,'success');closeGeneric();closeModal();renderUsers(fU);updateStats()}catch(e){showToast('❌ '+e.message,'error')}}
function editBalance(uid){editNumField(uid,'balance','الرصيد')}
function editProfit(uid){editNumField(uid,'profit','الأرباح')}
function editInvested(uid){editNumField(uid,'invested','المستثمر')}
function editRefProfit(uid){editNumField(uid,'referralProfit','ربح الإحالة')}

async function editField(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const keys=Object.keys(u).filter(k=>k!=='id');const html=`<div class="edit-form"><label>الحقل</label><select id="editK">${keys.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select><label>القيمة الجديدة (string/number/boolean/JSON)</label><textarea id="editV" placeholder='مثال: "قيمة" أو 100 أو true أو {"k":"v"}'></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveField('${uid}')"><i class="fas fa-save"></i> حفظ</button><button class="btn btn-danger" onclick="deleteField('${uid}')"><i class="fas fa-trash"></i> حذف الحقل</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('✏️ حقل مخصص',html)}
async function saveField(uid){const k=document.getElementById('editK').value;const raw=document.getElementById('editV').value;if(!k){showToast('⚠️','error');return}let val;try{val=JSON.parse(raw)}catch(e){val=raw}try{await db.collection('users').doc(uid).update({[k]:val});const u=allUsers.find(x=>x.id===uid);if(u)u[k]=val;showToast('✅ حُدّث','success');closeGeneric();closeModal()}catch(e){showToast('❌ '+e.message,'error')}}
async function deleteField(uid){const k=document.getElementById('editK').value;if(!confirm(`حذف حقل ${k}؟`))return;try{await db.collection('users').doc(uid).update({[k]:firebase.firestore.FieldValue.delete()});const u=allUsers.find(x=>x.id===uid);if(u)delete u[k];showToast('🗑️ حُذف','success');closeGeneric();closeModal()}catch(e){showToast('❌ '+e.message,'error')}}

async function toggleBlock(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const cur=!!gf(u,'isBlocked');try{await db.collection('users').doc(uid).update({isBlocked:!cur});u.isBlocked=!cur;showToast(!cur?'🚫 حُظر':'✅ أُلغي','success');closeModal();renderUsers(fU)}catch(e){showToast('❌ '+e.message,'error')}}
async function makeAdmin(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const cur=gf(u,'role');const newRole=cur==='admin'?'user':'admin';if(!confirm(`تغيير الدور إلى ${newRole}؟`))return;try{await db.collection('users').doc(uid).update({role:newRole});u.role=newRole;showToast('✅ الدور: '+newRole,'success');closeModal();renderUsers(fU);updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function deleteUser(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const name=gf(u,'name','displayName')||uid;if(!confirm(`⚠️ حذف الحساب "${name}" نهائياً؟\nسيتم حذف كل بياناته (إيداعات/معاملات/إشعارات/رسائل).`))return;if(!confirm('هل أنت متأكد 100%؟ لا يمكن التراجع.'))return;try{const uidVal=gf(u,'uid','id')||u.id;const batch=db.batch();batch.delete(db.collection('users').doc(uid));allDeposits.filter(d=>gf(d,'userId','uid')===uidVal||gf(d,'userId','uid')===uid).forEach(d=>batch.delete(db.collection('deposits').doc(d.id)));allTransactions.filter(t=>gf(t,'userId','uid')===uidVal||gf(t,'userId','uid')===uid).forEach(t=>batch.delete(db.collection('transactions').doc(t.id)));allNotifications.filter(n=>gf(n,'userId','uid')===uidVal||gf(n,'userId','uid')===uid).forEach(n=>batch.delete(db.collection('notifications').doc(n.id)));allMessages.filter(m=>gf(m,'userId','uid')===uidVal||gf(m,'userId','uid')===uid).forEach(m=>batch.delete(db.collection('support_messages').doc(m.id)));await batch.commit();allUsers=allUsers.filter(x=>x.id!==uid);allDeposits=allDeposits.filter(d=>gf(d,'userId','uid')!==uidVal&&gf(d,'userId','uid')!==uid);allTransactions=allTransactions.filter(t=>gf(t,'userId','uid')!==uidVal&&gf(t,'userId','uid')!==uid);allWithdrawals=allTransactions.filter(t=>gf(t,'type')==='withdrawal');allNotifications=allNotifications.filter(n=>gf(n,'userId','uid')!==uidVal&&gf(n,'userId','uid')!==uid);allMessages=allMessages.filter(m=>gf(m,'userId','uid')!==uidVal&&gf(m,'userId','uid')!==uid);fU=allUsers;fD=allDeposits;fT=allTransactions;fW=allWithdrawals;fN=allNotifications;fM=allMessages;renderUsers(fU);renderDeposits(fD);renderTransactions(fT);renderWithdrawals(fW);renderNotificationsGrouped(fN);renderMessagesGrouped(fM);updateStats();closeModal();showToast('🗑️ حُذف كل شيء','success')}catch(e){showToast('❌ '+e.message,'error')}}

async function deleteDoc(col,id){if(!confirm('حذف هذه الوثيقة؟'))return;try{await db.collection(col).doc(id).delete();if(col==='deposits'){allDeposits=allDeposits.filter(x=>x.id!==id);fD=allDeposits;renderDeposits(fD)}else if(col==='transactions'){allTransactions=allTransactions.filter(x=>x.id!==id);allWithdrawals=allTransactions.filter(t=>gf(t,'type')==='withdrawal');fT=allTransactions;fW=allWithdrawals;renderTransactions(fT);renderWithdrawals(fW)}else if(col==='broadcasts'){allBroadcasts=allBroadcasts.filter(x=>x.id!==id);fB=allBroadcasts;renderBroadcasts(fB)}updateStats();showToast('🗑️ حُذفت','success')}catch(e){showToast('❌ '+e.message,'error')}}

async function editDeposit(id){const d=allDeposits.find(x=>x.id===id);if(!d)return;const html=`<div class="edit-form"><label>amount</label><input type="number" step="0.01" id="edA" value="${gf(d,'amount')||0}"><label>status</label><select id="edS"><option value="pending"${gf(d,'status')==='pending'?' selected':''}>pending</option><option value="credited"${gf(d,'status')==='credited'?' selected':''}>credited</option><option value="completed"${gf(d,'status')==='completed'?' selected':''}>completed</option><option value="failed"${gf(d,'status')==='failed'?' selected':''}>failed</option><option value="rejected"${gf(d,'status')==='rejected'?' selected':''}>rejected</option></select><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveDeposit('${id}')"><i class="fas fa-save"></i> حفظ</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('✏️ تعديل الإيداع',html)}
async function saveDeposit(id){const amount=Number(document.getElementById('edA').value);const status=document.getElementById('edS').value;try{await db.collection('deposits').doc(id).update({amount,status});const d=allDeposits.find(x=>x.id===id);if(d){d.amount=amount;d.status=status}renderDeposits(fD);showToast('✅','success');closeGeneric();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function editTransaction(id){const t=allTransactions.find(x=>x.id===id);if(!t)return;const html=`<div class="edit-form"><label>amount</label><input type="number" step="0.01" id="edA" value="${gf(t,'amount')||0}"><label>type</label><select id="edT"><option value="deposit"${gf(t,'type')==='deposit'?' selected':''}>deposit</option><option value="withdrawal"${gf(t,'type')==='withdrawal'?' selected':''}>withdrawal</option></select><label>status</label><select id="edS"><option value="pending"${gf(t,'status')==='pending'?' selected':''}>pending</option><option value="completed"${gf(t,'status')==='completed'?' selected':''}>completed</option><option value="failed"${gf(t,'status')==='failed'?' selected':''}>failed</option><option value="credited"${gf(t,'status')==='credited'?' selected':''}>credited</option></select><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveTransaction('${id}')"><i class="fas fa-save"></i> حفظ</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('✏️ تعديل المعاملة',html)}
async function saveTransaction(id){const amount=Number(document.getElementById('edA').value);const type=document.getElementById('edT').value;const status=document.getElementById('edS').value;try{await db.collection('transactions').doc(id).update({amount,type,status});const t=allTransactions.find(x=>x.id===id);if(t){t.amount=amount;t.type=type;t.status=status}allWithdrawals=allTransactions.filter(x=>gf(x,'type')==='withdrawal');fW=allWithdrawals;renderTransactions(fT);renderWithdrawals(fW);showToast('✅','success');closeGeneric();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function approveWithdrawal(id){if(!confirm('الموافقة على السحب؟'))return;try{await db.collection('transactions').doc(id).update({status:'completed'});const t=allTransactions.find(x=>x.id===id);if(t)t.status='completed';renderWithdrawals(fW);showToast('✅ مقبول','success');updateStats()}catch(e){showToast('❌ '+e.message,'error')}}
async function rejectWithdrawal(id){if(!confirm('رفض السحب وإعادة المبلغ؟'))return;try{const t=allTransactions.find(x=>x.id===id);if(!t)return;const uid=gf(t,'userId','uid');const amount=Number(gf(t,'amount')||0);const batch=db.batch();batch.update(db.collection('transactions').doc(id),{status:'failed'});if(uid&&amount>0){const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);if(u){const cur=Number(gf(u,'balance')||0);batch.update(db.collection('users').doc(u.id),{balance:cur+amount});u.balance=cur+amount}}await batch.commit();t.status='failed';renderWithdrawals(fW);renderUsers(fU);showToast('❌ مرفوض + رُد المبلغ','success');updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function addDepositFor(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const html=`<div class="edit-form"><label>مبلغ الإيداع ($)</label><input type="number" step="0.01" id="dpA" placeholder="100"><label>الحالة</label><select id="dpS"><option value="credited">credited</option><option value="pending">pending</option><option value="completed">completed</option></select><label><input type="checkbox" id="dpAdd" checked> إضافة المبلغ إلى الرصيد</label><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveNewDeposit('${uid}')"><i class="fas fa-save"></i> إضافة</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('➕ إيداع جديد',html)}
async function saveNewDeposit(uid){const amount=Number(document.getElementById('dpA').value);const status=document.getElementById('dpS').value;const addBal=document.getElementById('dpAdd').checked;if(!amount||amount<=0){showToast('⚠️','error');return}try{const u=allUsers.find(x=>x.id===uid);const uidVal=gf(u,'uid','id')||u.id;const doc={userId:uidVal,amount,status,transactionHash:'admin_manual_'+Date.now(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('deposits').add(doc);const tRef=await db.collection('transactions').add({userId:uidVal,amount,type:'deposit',status,createdAt:firebase.firestore.FieldValue.serverTimestamp()});if(addBal){const cur=Number(gf(u,'balance')||0);await db.collection('users').doc(u.id).update({balance:cur+amount});u.balance=cur+amount}allDeposits.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}});allTransactions.push({id:tRef.id,userId:uidVal,amount,type:'deposit',status,createdAt:{seconds:Math.floor(Date.now()/1000)}});fD=allDeposits;fT=allTransactions;renderDeposits(fD);renderTransactions(fT);renderUsers(fU);showToast('✅ أُضيف','success');closeGeneric();closeModal();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function addWithdrawFor(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const html=`<div class="edit-form"><label>مبلغ السحب ($)</label><input type="number" step="0.01" id="wdA" placeholder="50"><label>عنوان السحب</label><input type="text" id="wdAddr" placeholder="0x..."><label>الحالة</label><select id="wdS"><option value="completed">completed</option><option value="pending">pending</option><option value="failed">failed</option></select><label><input type="checkbox" id="wdSub" checked> خصم من الرصيد</label><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveNewWithdraw('${uid}')"><i class="fas fa-save"></i> إضافة</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('➖ سحب جديد',html)}
async function saveNewWithdraw(uid){const amount=Number(document.getElementById('wdA').value);const addr=document.getElementById('wdAddr').value.trim();const status=document.getElementById('wdS').value;const sub=document.getElementById('wdSub').checked;if(!amount||amount<=0){showToast('⚠️','error');return}try{const u=allUsers.find(x=>x.id===uid);const uidVal=gf(u,'uid','id')||u.id;const doc={userId:uidVal,amount,type:'withdrawal',status,withdrawAddress:addr,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('transactions').add(doc);if(sub){const cur=Number(gf(u,'balance')||0);await db.collection('users').doc(u.id).update({balance:Math.max(0,cur-amount)});u.balance=Math.max(0,cur-amount)}allTransactions.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}});allWithdrawals=allTransactions.filter(t=>gf(t,'type')==='withdrawal');fT=allTransactions;fW=allWithdrawals;renderTransactions(fT);renderWithdrawals(fW);renderUsers(fU);showToast('✅','success');closeGeneric();closeModal();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

async function sendNotifyFor(uid){const u=allUsers.find(x=>x.id===uid);if(!u)return;const html=`<div class="edit-form"><label>العنوان</label><input type="text" id="ntT" placeholder="عنوان الإشعار"><label>الرسالة</label><textarea id="ntM" placeholder="نص الإشعار..."></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveNotify('${uid}')"><i class="fas fa-paper-plane"></i> إرسال</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('🔔 إشعار للمستخدم',html)}
async function saveNotify(uid){const title=document.getElementById('ntT').value.trim();const message=document.getElementById('ntM').value.trim();if(!message){showToast('⚠️','error');return}try{const u=allUsers.find(x=>x.id===uid);const uidVal=gf(u,'uid','id')||u.id;const doc={userId:uidVal,title:title||'إشعار',message,type:'admin',isRead:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('notifications').add(doc);allNotifications.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}});fN=allNotifications;renderNotificationsGrouped(fN);showToast('✅','success');closeGeneric();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

/* ===== BROADCAST + GLOBAL NOTIFY ===== */
function openBroadcastModal(){const html=`<div class="edit-form"><label>العنوان</label><input type="text" id="bcT" placeholder="عنوان الإذاعة"><label>الرسالة</label><textarea id="bcM" placeholder="نص الإذاعة..." style="min-height:100px"></textarea><label>رابط صورة (اختياري)</label><input type="text" id="bcI" placeholder="https://..."><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="saveBroadcast()"><i class="fas fa-bullhorn"></i> إذاعة</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('📢 إذاعة عامة',html)}
async function saveBroadcast(){const title=document.getElementById('bcT').value.trim();const message=document.getElementById('bcM').value.trim();const imageUrl=document.getElementById('bcI').value.trim();if(!message){showToast('⚠️','error');return}try{const doc={title:title||'إعلان',message,imageUrl:imageUrl||null,createdBy:'admin',createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('broadcasts').add(doc);allBroadcasts.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}});fB=allBroadcasts;renderBroadcasts(fB);showToast('📢 نُشرت','success');closeGeneric();updateStats()}catch(e){showToast('❌ '+e.message,'error')}}

function openGlobalNotifyModal(){const html=`<div class="edit-form"><label>العنوان</label><input type="text" id="gnT" placeholder="عنوان"><label>الرسالة</label><textarea id="gnM" placeholder="نص الإشعار..." style="min-height:100px"></textarea><label style="color:#f97316">سيُرسل إلى <b>${allUsers.length}</b> مستخدم</label><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-success" onclick="sendGlobalNotify()"><i class="fas fa-paper-plane"></i> إرسال للجميع</button><button class="btn btn-secondary" onclick="closeGeneric()">إلغاء</button></div></div>`;openGeneric('🔔 إشعار للجميع',html)}
async function sendGlobalNotify(){const title=document.getElementById('gnT').value.trim();const message=document.getElementById('gnM').value.trim();if(!message){showToast('⚠️','error');return}if(!confirm(`إرسال إلى ${allUsers.length} مستخدم؟`))return;try{const chunks=[];for(let i=0;i<allUsers.length;i+=400)chunks.push(allUsers.slice(i,i+400));for(const ck of chunks){const batch=db.batch();ck.forEach(u=>{const uidVal=gf(u,'uid','id')||u.id;const ref=db.collection('notifications').doc();batch.set(ref,{userId:uidVal,title:title||'إشعار',message,type:'admin',isRead:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});await batch.commit()}showToast(`✅ أُرسل إلى ${allUsers.length}`,'success');closeGeneric();loadAllData()}catch(e){showToast('❌ '+e.message,'error')}}

/* ===== FILTERS + STATS + CSV ===== */
function filterUsers(){const q=document.getElementById('userSearch').value.toLowerCase().trim();fU=!q?allUsers:allUsers.filter(u=>JSON.stringify(u).toLowerCase().includes(q));renderUsers(fU)}
function filterDeposits(){const q=document.getElementById('depSearch').value.toLowerCase().trim();fD=!q?allDeposits:allDeposits.filter(d=>{const uid=gf(d,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(d)+em).toLowerCase().includes(q)});renderDeposits(fD)}
function filterTransactions(){const q=document.getElementById('txSearch').value.toLowerCase().trim();fT=!q?allTransactions:allTransactions.filter(t=>{const uid=gf(t,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(t)+em).toLowerCase().includes(q)});renderTransactions(fT)}
function filterWithdrawals(){const q=document.getElementById('wdSearch').value.toLowerCase().trim();fW=!q?allWithdrawals:allWithdrawals.filter(w=>{const uid=gf(w,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(w)+em).toLowerCase().includes(q)});renderWithdrawals(fW)}
function filterBroadcasts(){const q=document.getElementById('bcSearch').value.toLowerCase().trim();fB=!q?allBroadcasts:allBroadcasts.filter(b=>JSON.stringify(b).toLowerCase().includes(q));renderBroadcasts(fB)}
function filterNotifications(){const q=document.getElementById('ntSearch').value.toLowerCase().trim();fN=!q?allNotifications:allNotifications.filter(n=>{const uid=gf(n,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';const nm=u?(gf(u,'name','displayName')||''):'';return(JSON.stringify(n)+em+nm).toLowerCase().includes(q)});renderNotificationsGrouped(fN)}
function filterMessages(){const q=document.getElementById('msgSearch').value.toLowerCase().trim();fM=!q?allMessages:allMessages.filter(m=>{const uid=gf(m,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(m)+em).toLowerCase().includes(q)});renderMessagesGrouped(fM)}

function updateStats(){document.getElementById('totalUsers').textContent=allUsers.length;document.getElementById('totalDeposits').textContent=allDeposits.length;document.getElementById('totalWithdrawals').textContent=allWithdrawals.length;document.getElementById('totalAdmins').textContent=allUsers.filter(u=>gf(u,'role')==='admin').length;document.getElementById('pendingDeposits').textContent=allDeposits.filter(d=>(gf(d,'status')||'pending')==='pending').length;document.getElementById('pendingWithdrawals').textContent=allWithdrawals.filter(w=>(gf(w,'status')||'pending')==='pending').length;const tb=allUsers.reduce((s,u)=>s+Number(gf(u,'balance','wallet')||0),0);document.getElementById('totalBalance').textContent='$'+tb.toFixed(2);const ti=allUsers.reduce((s,u)=>s+Number(gf(u,'invested','totalInvested')||0),0);document.getElementById('totalInvested').textContent='$'+ti.toFixed(2);const tp=allUsers.reduce((s,u)=>s+Number(gf(u,'profit','earnings')||0),0);document.getElementById('totalProfit').textContent='$'+tp.toFixed(2);document.getElementById('totalBroadcasts').textContent=allBroadcasts.length;document.getElementById('totalNotifications').textContent=allNotifications.length;document.getElementById('totalMessages').textContent=allMessages.length}

function exportCSV(){if(!allUsers.length&&!allDeposits.length){showToast('⚠️','error');return}let c="=== المستخدمين ===\nuid,name,email,phone,role,balance,invested,profit,createdAt\n";allUsers.forEach(u=>{c+=[gf(u,'uid','id')||'',gf(u,'name','displayName')||'',getEmail(u),gf(u,'phone','phoneNumber')||'',gf(u,'role')||'',gf(u,'balance','wallet')||0,gf(u,'invested')||0,gf(u,'profit')||0,fmtDate(gf(u,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== الإيداعات ===\nid,userId,email,amount,status,createdAt\n";allDeposits.forEach(d=>{const uid=gf(d,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[d.id,uid||'',u?getEmail(u):'',gf(d,'amount')||0,gf(d,'status')||'',fmtDate(gf(d,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== المعاملات ===\nid,userId,email,amount,type,status,createdAt\n";allTransactions.forEach(t=>{const uid=gf(t,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[t.id,uid||'',u?getEmail(u):'',gf(t,'amount')||0,gf(t,'type')||'',gf(t,'status')||'',fmtDate(gf(t,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
const blob=new Blob(["\ufeff"+c],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`nexora_${new Date().toISOString().slice(0,10)}.csv`;link.click();showToast('✅ CSV','success')}

function refreshAll(){loadAllData()}
window.onload=function(){loadAllData()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeChat();closeGeneric()}});
</script></body></html>
