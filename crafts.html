<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Nexora - استخراج بيانات المستخدمين</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a0a14; color: #e2e8f0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #f97316; font-size: 28px; margin-bottom: 8px; }
        .sub { color: #94a3b8; margin-bottom: 20px; }
        .btn { background: #f97316; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; }
        .btn:hover { background: #ea580c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 16px; text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: 700; color: #f97316; }
        .stat-card .label { font-size: 13px; color: #94a3b8; }
        .table-wrapper { background: rgba(255,255,255,0.03); border-radius: 12px; overflow: auto; border: 1px solid rgba(255,255,255,0.05); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: rgba(255,255,255,0.05); padding: 12px 14px; text-align: right; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); word-break: break-word; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .loading .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-admin { background: rgba(239,68,68,0.2); color: #f87171; }
        .badge-user { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .badge-bronze { background: rgba(180,130,70,0.2); color: #d4a574; }
        .badge-silver { background: rgba(192,192,192,0.2); color: #c0c0c0; }
        .badge-gold { background: rgba(255,215,0,0.2); color: #ffd700; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 10px; color: #fff; font-size: 14px; z-index: 999; animation: slideUp 0.3s ease; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { th, td { padding: 8px 10px; font-size: 12px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Nexora - استخراج بيانات المستخدمين</h1>
    <div class="sub">⚡ Firestore مفتوح للقراءة العامة - استعراض جميع المستخدمين</div>
    
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="btn" id="loadBtn" onclick="loadUsers()">📥 تحميل جميع المستخدمين</button>
        <button class="btn" onclick="exportCSV()" style="background:#22c55e;">📤 تصدير CSV</button>
        <button class="btn" onclick="document.getElementById('rawOutput').style.display='block'" style="background:#3b82f6;">🔍 عرض خام</button>
    </div>
    
    <div class="stats" id="stats"></div>
    
    <div class="table-wrapper" id="tableWrapper">
        <div class="loading" id="loading"><div class="spinner"></div> اضغط "تحميل" لعرض البيانات</div>
        <div id="tableContainer" style="display:none;"></div>
    </div>
    
    <pre id="rawOutput" style="display:none;background:rgba(0,0,0,0.3);padding:16px;border-radius:8px;overflow:auto;max-height:400px;font-size:12px;color:#94a3b8;margin-top:12px;white-space:pre-wrap;word-break:break-all;"></pre>
</div>

<script>
// ============================================================
// 🔥 Firebase Config (مستخرج من التطبيق)
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyBkltiLTJmgYG0x4E5_VUGCygE7lJLuYdk",
    authDomain: "nexora-c4c6a.firebaseapp.com",
    projectId: "nexora-c4c6a",
    storageBucket: "nexora-c4c6a.firebasestorage.app",
    messagingSenderId: "585160881490",
    appId: "1:585160881490:web:d1d605a47ad08248ea368b"
};

// تهيئة Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allUsers = [];
let loading = false;

// ============================================================
// 📥 تحميل جميع المستخدمين
// ============================================================
async function loadUsers() {
    if (loading) return;
    loading = true;
    const btn = document.getElementById('loadBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جاري التحميل...';
    
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tableContainer').style.display = 'none';
    
    try {
        // 🔥 استعلام مباشر إلى Firestore (بدون مصادقة!)
        const snapshot = await db.collection('users').get();
        allUsers = [];
        snapshot.forEach(doc => {
            allUsers.push({ id: doc.id, ...doc.data() });
        });
        
        renderUsers(allUsers);
        updateStats(allUsers);
        showToast(`✅ تم تحميل ${allUsers.length} مستخدم`, 'success');
        
        // عرض خام
        document.getElementById('rawOutput').textContent = JSON.stringify(allUsers, null, 2);
        
    } catch (error) {
        showToast(`❌ فشل التحميل: ${error.message}`, 'error');
        console.error(error);
    }
    
    loading = false;
    btn.disabled = false;
    btn.textContent = '📥 تحميل جميع المستخدمين';
}

// ============================================================
// 📊 عرض المستخدمين
// ============================================================
function renderUsers(users) {
    const container = document.getElementById('tableContainer');
    const loading = document.getElementById('loading');
    
    if (!users || users.length === 0) {
        container.innerHTML = `<div class="loading">لا توجد بيانات</div>`;
        container.style.display = 'block';
        loading.style.display = 'none';
        return;
    }
    
    let html = `
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>UID</th>
                    <th>البريد الإلكتروني</th>
                    <th>الدور</th>
                    <th>المستوى</th>
                    <th>البرامج النشطة</th>
                    <th>تاريخ الإنشاء</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    users.forEach((user, index) => {
        const roleClass = user.role === 'admin' ? 'badge-admin' : 'badge-user';
        const levelClass = user.level === 'bronze' ? 'badge-bronze' :
                          user.level === 'silver' ? 'badge-silver' :
                          user.level === 'gold' ? 'badge-gold' : '';
        const programs = user.activePrograms ? user.activePrograms.length : 0;
        const createdAt = user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleString('ar-EG') : '—';
        
        html += `
            <tr>
                <td>${index + 1}</td>
                <td><code style="font-size:11px;color:#94a3b8;">${user.id || '—'}</code></td>
                <td>${user.email || '—'}</td>
                <td><span class="badge ${roleClass}">${user.role || 'user'}</span></td>
                <td><span class="badge ${levelClass}">${user.level || '—'}</span></td>
                <td>${programs}</td>
                <td>${createdAt}</td>
            </tr>
        `;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
    container.style.display = 'block';
    loading.style.display = 'none';
}

// ============================================================
// 📊 الإحصائيات
// ============================================================
function updateStats(users) {
    const stats = document.getElementById('stats');
    const admins = users.filter(u => u.role === 'admin').length;
    const bronzes = users.filter(u => u.level === 'bronze').length;
    const silvers = users.filter(u => u.level === 'silver').length;
    const golds = users.filter(u => u.level === 'gold').length;
    
    stats.innerHTML = `
        <div class="stat-card"><div class="number">${users.length}</div><div class="label">👥 إجمالي المستخدمين</div></div>
        <div class="stat-card"><div class="number">${admins}</div><div class="label">🛡️ المسؤولين</div></div>
        <div class="stat-card"><div class="number">${bronzes}</div><div class="label">🥉 برونز</div></div>
        <div class="stat-card"><div class="number">${silvers}</div><div class="label">🥈 فضي</div></div>
        <div class="stat-card"><div class="number">${golds}</div><div class="label">🥇 ذهبي</div></div>
    `;
}

// ============================================================
// 📤 تصدير CSV
// ============================================================
function exportCSV() {
    if (allUsers.length === 0) {
        showToast('⚠️ لا توجد بيانات للتصدير', 'error');
        return;
    }
    
    let csv = "UID,البريد الإلكتروني,الدور,المستوى,البرامج النشطة\n";
    allUsers.forEach(u => {
        csv += `${u.id || ''},${u.email || ''},${u.role || ''},${u.level || ''},${u.activePrograms ? u.activePrograms.length : 0}\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `nexora_users_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    showToast('✅ تم التصدير', 'success');
}

// ============================================================
// 📨 Toast
// ============================================================
function showToast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

// ============================================================
// 🔍 استعلامات إضافية (نظرياً)
// ============================================================
async function queryCollection(collection) {
    try {
        const snapshot = await db.collection(collection).get();
        const data = [];
        snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
        console.log(`📦 ${collection}:`, data);
        return data;
    } catch(e) {
        console.log(`❌ ${collection}:`, e.message);
        return [];
    }
}

// ============================================================
// 🚀 تحميل تلقائي عند فتح الصفحة
// ============================================================
window.onload = function() {
    showToast('🔥 جاهز! اضغط "تحميل" لعرض البيانات', 'info');
};
</script>

</body>
</html>
