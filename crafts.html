<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔥 Nexora - لوحة التحكم</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#0a0a14;color:#e2e8f0;min-height:100vh;padding:16px}
.container{max-width:1400px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;padding:20px 28px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{color:#94a3b8;font-size:13px}
.header .badge-status{padding:6px 16px;border-radius:20px;font-size:13px;border:1px solid rgba(249,115,22,.3)}
.badge-connected{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.3)}
.badge-error{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;transition:.3s}
.stat-card:hover{border-color:rgba(249,115,22,.2);background:rgba(255,255,255,.05)}
.stat-card .number{font-size:24px;font-weight:700;color:#f97316}
.stat-card .label{font-size:12px;color:#94a3b8;margin-top:4px}
.controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:#f97316;color:#fff}.btn-primary:hover{background:#ea580c;transform:translateY(-2px)}
.btn-success{background:#22c55e;color:#fff}.btn-success:hover{background:#16a34a;transform:translateY(-2px)}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626;transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.08);color:#e2e8f0}.btn-secondary:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.btn-sm{padding:5px 10px;font-size:11px}
.search-bar{margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
.search-bar input:focus{border-color:rgba(249,115,22,.4)}.search-bar input::placeholder{color:#64748b}
.tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:4px}
.tab-btn{padding:10px 18px;border:none;border-radius:10px 10px 0 0;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;background:transparent;color:#94a3b8}
.tab-btn.active{background:rgba(249,115,22,.15);color:#f97316;border-bottom:2px solid #f97316}
.tab-btn:hover:not(.active){color:#fff;background:rgba(255,255,255,.05)}
.panel{display:none}.panel.active{display:block}
.table-wrapper{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:rgba(255,255,255,.04)}
th{padding:12px 14px;text-align:right;font-weight:600;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;word-break:break-word}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:2px 12px;border-radius:12px;font-size:11px;font-weight:600}
.badge-admin{background:rgba(239,68,68,.2);color:#f87171}.badge-user{background:rgba(59,130,246,.2);color:#60a5fa}
.badge-bronze{background:rgba(180,130,70,.2);color:#d4a574}.badge-silver{background:rgba(192,192,192,.2);color:#c0c0c0}.badge-gold{background:rgba(255,215,0,.2);color:#ffd700}
.badge-pending{background:rgba(249,115,22,.2);color:#f97316}.badge-approved{background:rgba(34,197,94,.2);color:#4ade80}
.badge-rejected{background:rgba(239,68,68,.2);color:#f87171}.badge-completed{background:rgba(59,130,246,.2);color:#60a5fa}
.badge-active{background:rgba(34,197,94,.2);color:#4ade80}.badge-banned{background:rgba(239,68,68,.2);color:#f87171}.badge-suspended{background:rgba(249,115,22,.2);color:#f97316}
.loading{text-align:center;padding:40px;color:#64748b}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:#f97316;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:#64748b}.empty .icon{font-size:40px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;z-index:9999;animation:slideUp .3s ease;max-width:450px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast-success{background:#22c55e}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:10000;overflow-y:auto;backdrop-filter:blur(4px)}
.modal-card{background:#11111e;border:1px solid rgba(255,255,255,.08);border-radius:16px;max-width:750px;margin:30px auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;background:#11111e;border-radius:16px 16px 0 0;z-index:1}
.modal-header h3{font-size:16px;color:#f97316;word-break:break-word}
.modal-close{background:rgba(239,68,68,.15);border:none;color:#f87171;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;transition:.3s;flex-shrink:0}
.modal-close:hover{background:rgba(239,68,68,.3)}
.modal-body{padding:20px 24px;max-height:75vh;overflow-y:auto}
.modal-section{margin-bottom:20px}
.modal-section-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center}
.modal-field{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.02);font-size:13px}
.modal-field-k{min-width:150px;color:#94a3b8;font-weight:600;flex-shrink:0}
.modal-field-v{color:#e2e8f0;word-break:break-word;flex:1}.modal-field-v a{color:#f97316}
.modal-sub-table{width:100%;font-size:12px;margin-top:8px}
.modal-sub-table th{padding:6px 10px;font-size:11px}.modal-sub-table td{padding:6px 10px}
.modal-raw{background:rgba(0,0,0,.3);padding:12px;border-radius:8px;font-size:11px;color:#94a3b8;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;direction:ltr;text-align:left}
.copy-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);color:#f97316;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:.3s}
.copy-btn:hover{background:rgba(249,115,22,.3)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.3);border-radius:10px}
@media(max-width:768px){.header{flex-direction:column;text-align:center;padding:16px}.stats{grid-template-columns:1fr 1fr}th,td{padding:8px 10px;font-size:12px}.controls{flex-direction:column}.controls .btn{width:100%;justify-content:center}.tab-btn{flex:1;text-align:center;padding:8px 10px;font-size:12px}.modal-card{margin:10px}.modal-field-k{min-width:100px}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.header h1{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div><h1>🔥 Nexora · لوحة التحكم</h1><div class="subtitle">إدارة المستخدمين، الإيداعات، والسحوبات — عرض شامل لكل البيانات</div></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="badge-status badge-connected" id="connectionStatus"><i class="fas fa-circle" style="font-size:10px;color:#4ade80"></i> متصل</span></div>
</div>
<div class="stats" id="stats">
<div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">👥 المستخدمين</div></div>
<div class="stat-card"><div class="number" id="totalDeposits">0</div><div class="label">📥 الإيداعات</div></div>
<div class="stat-card"><div class="number" id="totalWithdrawals">0</div><div class="label">📤 السحوبات</div></div>
<div class="stat-card"><div class="number" id="totalAdmins">0</div><div class="label">🛡️ المسؤولين</div></div>
<div class="stat-card"><div class="number" id="pendingDeposits">0</div><div class="label">⏳ إيداعات معلقة</div></div>
<div class="stat-card"><div class="number" id="pendingWithdrawals">0</div><div class="label">⏳ سحوبات معلقة</div></div>
<div class="stat-card"><div class="number" id="totalBalance">$0</div><div class="label">💰 إجمالي الأرصدة</div></div>
</div>
<div class="controls">
<button class="btn btn-primary" id="loadBtn" onclick="loadAllData()"><i class="fas fa-download"></i> تحميل البيانات</button>
<button class="btn btn-success" onclick="exportCSV()"><i class="fas fa-file-export"></i> تصدير CSV</button>
<button class="btn btn-secondary" onclick="refreshAll()"><i class="fas fa-sync-alt"></i> تحديث</button>
<button class="btn btn-secondary" onclick="toggleRaw()"><i class="fas fa-code"></i> عرض خام</button>
</div>
<div class="tabs">
<button class="tab-btn active" data-tab="users" onclick="switchTab('users')"><i class="fas fa-users"></i> المستخدمين</button>
<button class="tab-btn" data-tab="deposits" onclick="switchTab('deposits')"><i class="fas fa-arrow-down"></i> الإيداعات</button>
<button class="tab-btn" data-tab="withdrawals" onclick="switchTab('withdrawals')"><i class="fas fa-arrow-up"></i> السحوبات</button>
</div>
<div id="panelUsers" class="panel active">
<div class="search-bar"><input type="text" id="userSearch" placeholder="🔍 بحث في كل بيانات المستخدمين (الاسم، البريد، الهاتف، UID، البلد...)" oninput="filterUsers()"></div>
<div class="table-wrapper" id="usersContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div>
</div>
<div id="panelDeposits" class="panel">
<div class="search-bar"><input type="text" id="depSearch" placeholder="🔍 بحث في الإيداعات..." oninput="filterDeposits()"></div>
<div class="table-wrapper" id="depositsContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div>
</div>
<div id="panelWithdrawals" class="panel">
<div class="search-bar"><input type="text" id="wdSearch" placeholder="🔍 بحث في السحوبات..." oninput="filterWithdrawals()"></div>
<div class="table-wrapper" id="withdrawalsContainer"><div class="loading"><div class="spinner"></div> جاري التحميل...</div></div>
</div>
<pre id="rawOutput" style="display:none;background:rgba(0,0,0,.3);padding:16px;border-radius:8px;overflow:auto;max-height:400px;font-size:12px;color:#94a3b8;margin-top:12px;white-space:pre-wrap;word-break:break-all"></pre>
</div>
<div class="modal" id="userModal" onclick="if(event.target===this)closeModal()">
<div class="modal-card">
<div class="modal-header"><h3 id="modalTitle">تفاصيل المستخدم</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
<div class="modal-body" id="modalContent"></div>
</div>
</div>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyBkltiLTJmgYG0x4E5_VUGCygE7lJLuYdk",authDomain:"nexora-c4c6a.firebaseapp.com",projectId:"nexora-c4c6a",storageBucket:"nexora-c4c6a.firebasestorage.app",messagingSenderId:"585160881490",appId:"1:585160881490:web:d1d605a47ad08248ea368b"};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
let allUsers=[],allDeposits=[],allWithdrawals=[],currentTab='users',loading=false,fU=[],fD=[],fW=[];
function showToast(m,t='info'){const e=document.querySelector('.toast');if(e)e.remove();const el=document.createElement('div');el.className=`toast toast-${t}`;el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),4000)}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(`panel${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.add('active')}
/* دالة البديل الذكي: تبحث في عدة أسماء حقول وتعيد أول قيمة موجودة */
function gf(o,...keys){for(const k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return null}
/* تنسيق التاريخ */
function fmtDate(v){if(!v)return'—';if(typeof v==='object'&&v.seconds)return new Date(v.seconds*1000).toLocaleString('ar-EG');if(typeof v==='number')return new Date(v).toLocaleString('ar-EG');if(typeof v==='string'&&v.length>8)return v;return'—'}
/* عرض أي قيمة بأي نوع داخل المودال */
function rv(v){if(v===null||v===undefined)return'<span style="color:#64748b">—</span>';if(typeof v==='boolean')return v?'<span style="color:#4ade80">✅ نعم</span>':'<span style="color:#f87171">❌ لا</span>';if(typeof v==='object'&&v.seconds)return new Date(v.seconds*1000).toLocaleString('ar-EG');if(Array.isArray(v)){if(v.length===0)return'<span style="color:#64748b">[] فارغ</span>';return v.map((item,idx)=>typeof item==='object'?`<details><summary style="cursor:pointer;color:#f97316">عنصر ${idx+1}</summary><pre style="font-size:11px;color:#94a3b8;margin:4px 0;white-space:pre-wrap">${JSON.stringify(item,null,2)}</pre></details>`:String(item)).join(', ')}if(typeof v==='object')return`<pre style="font-size:11px;color:#94a3b8;margin:0;white-space:pre-wrap;direction:ltr;text-align:left">${JSON.stringify(v,null,2)}</pre>`;if(typeof v==='string'&&v.startsWith('http'))return`<a href="${v}" target="_blank" style="color:#f97316">${v.length>50?v.substring(0,50)+'...':v}</a>`;return String(v)}
async function loadAllData(){if(loading)return;loading=true;const btn=document.getElementById('loadBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';try{const uS=await db.collection('users').get();allUsers=[];uS.forEach(d=>allUsers.push({id:d.id,...d.data()}));const dS=await db.collection('deposits').get();allDeposits=[];dS.forEach(d=>allDeposits.push({id:d.id,...d.data()}));const wS=await db.collection('withdrawals').get();allWithdrawals=[];wS.forEach(d=>allWithdrawals.push({id:d.id,...d.data()}));fU=allUsers;fD=allDeposits;fW=allWithdrawals;renderUsers(fU);renderDeposits(fD);renderWithdrawals(fW);updateStats();document.getElementById('rawOutput').textContent=JSON.stringify({users:allUsers,deposits:allDeposits,withdrawals:allWithdrawals},null,2);showToast(`✅ تم تحميل ${allUsers.length} مستخدم، ${allDeposits.length} إيداع، ${allWithdrawals.length} سحب`,'success')}catch(e){showToast(`❌ فشل التحميل: ${e.message}`,'error');console.error(e)}loading=false;btn.disabled=false;btn.innerHTML='<i class="fas fa-download"></i> تحميل البيانات'}
function renderUsers(users){const c=document.getElementById('usersContainer');if(!users||users.length===0){c.innerHTML=`<div class="empty"><div class="icon">👥</div><div>لا يوجد مستخدمين</div></div>`;return}let h=`<table><thead><tr><th>#</th><th>UID</th><th>البريد</th><th>الاسم</th><th>الهاتف</th><th>الدور</th><th>المستوى</th><th>الرصيد</th><th>الحالة</th><th>موثق</th><th>البلد</th><th>المدينة</th><th>آخر دخول</th><th>كود الدعوة</th><th>المدعو بواسطة</th><th>إيداعات</th><th>سحوبات</th><th>أرباح</th><th>برامج</th><th>التسجيل</th><th>حقول</th><th>إجراءات</th></tr></thead><tbody>`;users.forEach((u,i)=>{const docId=u.id||'';const uid=gf(u,'uid','id')||'—';const email=gf(u,'email','userEmail','mail')||'—';const name=gf(u,'displayName','name','username','fullName','nickName','nickname')||'—';const phone=gf(u,'phone','phoneNumber','mobile','phone_number','tel','telephone')||'—';const role=gf(u,'role','userRole','type','accountType')||'user';const level=gf(u,'level','tier','rank','membershipLevel','membership','vipLevel')||'—';const balance=gf(u,'balance','wallet','totalBalance','accountBalance','credits','funds','availableBalance')||0;const rawStatus=gf(u,'status','accountStatus','state','accountState');const banned=gf(u,'banned','isBanned','is_banned');const suspended=gf(u,'suspended','isSuspended');const status=rawStatus||(banned===true?'banned':suspended===true?'suspended':'active');const verified=gf(u,'verified','isVerified','emailVerified','phoneVerified','identityVerified');const country=gf(u,'country','countryCode','nationality','country_name')||'—';const city=gf(u,'city','town','region','cityName','location')||'—';const lastLogin=gf(u,'lastLogin','lastSeen','lastActive','lastLoginAt','last_login','lastActivity');const refCode=gf(u,'referralCode','refCode','inviteCode','referral_code')||'—';const referredBy=gf(u,'referredBy','referrer','invitedBy','referred_by','sponsor')||'—';const uDeps=allDeposits.filter(d=>{const did=gf(d,'userId','uid','userUid');const dem=gf(d,'userEmail','email');return(did&&(did===uid||did===docId))||(dem&&dem===email)});const uWds=allWithdrawals.filter(w=>{const wid=gf(w,'userId','uid','userUid');const wem=gf(w,'userEmail','email');return(wid&&(wid===uid||wid===docId))||(wem&&wem===email)});const totalDep=gf(u,'totalDeposits','depositsTotal','totalDeposited','depositCount')||uDeps.length;const totalWd=gf(u,'totalWithdrawals','withdrawalsTotal','totalWithdrawn','withdrawalCount')||uWds.length;const profit=gf(u,'profit','earnings','totalProfit','totalEarnings','netProfit','totalEarning')||0;const programs=gf(u,'activePrograms','programs','subscribedPrograms','subscriptions','plans');const programsCount=Array.isArray(programs)?programs.length:(programs||0);const createdAt=gf(u,'createdAt','created_at','registeredAt','joinDate','dateCreated','registrationDate','signupDate');const totalFields=Object.keys(u).length;const roleClass=role==='admin'?'badge-admin':'badge-user';const levelClass=level==='bronze'?'badge-bronze':level==='silver'?'badge-silver':level==='gold'?'badge-gold':level==='platinum'?'badge-silver':'';const statusClass=status==='banned'?'badge-banned':status==='suspended'?'badge-suspended':'badge-active';const verifiedBadge=verified===true||verified==='true'?'<span class="badge badge-approved">✅</span>':verified===false||verified==='false'?'<span class="badge" style="background:rgba(100,116,139,.2);color:#94a3b8">❌</span>':'<span class="badge" style="background:rgba(100,116,139,.2);color:#94a3b8">—</span>';h+=`<tr style="cursor:pointer" onclick="showUserDetails('${docId}')"><td>${i+1}</td><td><code style="font-size:10px;color:#94a3b8" title="${uid}">${String(uid).substring(0,12)}…</code></td><td><strong>${email}</strong></td><td>${name}</td><td>${phone}</td><td><span class="badge ${roleClass}">${role}</span></td><td><span class="badge ${levelClass}">${level}</span></td><td style="color:#f97316;font-weight:600">$${balance}</td><td><span class="badge ${statusClass}">${status}</span></td><td style="text-align:center">${verifiedBadge}</td><td>${country}</td><td>${city}</td><td style="font-size:10px;color:#94a3b8">${lastLogin?fmtDate(lastLogin):'—'}</td><td style="font-size:11px">${refCode}</td><td style="font-size:10px;color:#94a3b8">${String(referredBy).substring(0,15)}</td><td style="text-align:center">${totalDep}</td><td style="text-align:center">${totalWd}</td><td style="color:#22c55e;font-weight:600">$${profit}</td><td style="text-align:center">${programsCount}</td><td style="font-size:10px;color:#94a3b8">${fmtDate(createdAt)}</td><td style="text-align:center"><span class="badge" style="background:rgba(249,115,22,.1);color:#f97316">${totalFields}</span></td><td onclick="event.stopPropagation();event.cancelBubble=true" style="white-space:nowrap"><button class="btn btn-success btn-sm" onclick="makeAdmin('${docId}')" title="ترقية لمسؤول"><i class="fas fa-user-shield"></i></button> <button class="btn btn-secondary btn-sm" onclick="showUserDetails('${docId}')" title="عرض كل البيانات"><i class="fas fa-eye"></i></button></td></tr>`});h+=`</tbody></table>`;c.innerHTML=h}
