<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>صفحتي</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#000;min-height:100vh}.w{max-width:430px;margin:0 auto}.hd{position:relative;background:#0c0c0c;border-radius:0 0 30px 30px;padding:16px 14px 0}.bal{display:flex;align-items:center;justify-content:center;gap:12px}.c{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd75e,#f0a71c 70%,#d4890b);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}.bal b{font-size:42px;font-weight:800;color:#fff;letter-spacing:-1px;direction:ltr}.vip{position:absolute;top:74px;left:12px;width:88px;text-align:center;z-index:3}.vip img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid #ff2d8e;box-shadow:0 0 20px 4px rgba(255,45,142,.75)}.vip s{display:block;text-decoration:none;font-size:13px;font-weight:800;color:#fff;margin-top:7px}.hero{margin-top:-14px;position:relative;z-index:2}.hero img{display:block;width:86%;max-width:330px;margin:0 auto;object-fit:contain}.row{display:flex;direction:ltr;gap:10px;padding:6px 14px 0}.row button{flex:1;background:#fff;border:none;border-radius:16px;padding:15px 4px;font-size:15px;font-weight:700;color:#0d0d0d;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.15s}.row button:active{transform:scale(.97);background:#ececec}.cd{background:#151515;border-radius:22px;margin:14px;padding:16px}.ps{font-size:19px;font-weight:800;color:#fff;direction:ltr;text-align:left}.ps i{font-style:normal;color:#8e8e93;font-weight:600;font-size:17px}.bar{height:16px;border-radius:10px;background:#2a2a2a;margin:14px 0;overflow:hidden}.bar div{width:45%;height:100%;border-radius:10px;background:repeating-linear-gradient(115deg,#8b5cf6 0 7px,#5b21b6 7px 14px)}.cl{width:100%;background:#c8f31d;border:none;border-radius:16px;padding:18px;font-size:19px;font-weight:800;color:#0d0d0d;cursor:pointer;transition:.15s}.cl:active{transform:scale(.98);background:#b4dc12}.log{padding:6px 14px 30px}.log h3{font-size:14px;color:#8e8e93;margin-bottom:9px}.lb{background:#151515;border-radius:16px;padding:34px 18px;text-align:center;color:#5a5a5f;font-size:15px}</style></head><body><div class="w"><div class="hd"><div class="bal"><div class="c">🙂</div><b>153,490,751</b></div><div class="vip"><img src="https://i.ibb.co/Y4Wq6Pzx/IMG.png" alt="VIP"><s>VIP PASS</s></div><div class="hero"><img src="https://i.ibb.co/Y4Wq6Pzx/IMG.png" alt="أيقونة"></div></div><div class="row"><button onclick="addLog('العمليات')">★ العمليات</button><button onclick="addLog('ارسال دروب')">👤 ارسال دروب</button><button onclick="addLog('دروب')">🎁 دروب</button></div><div class="cd"><div class="ps">+0,15 $LOON <i>/Per Sec</i></div><div class="bar"><div></div></div><button class="cl" onclick="addLog('انزال الدروب 6,755 $LOON')">انزال الدروب 6,755 $LOON</button></div><div class="log"><h3>السجل</h3><div class="lb" id="logBox">نو داتا</div></div></div><script>function addLog(t){var b=document.getElementById('logBox');if(b.textContent==='نو داتا'){b.innerHTML=''}var d=new Date().toLocaleTimeString('ar');var e=document.createElement('div');e.style.cssText='padding:10px 0;border-bottom:1px solid #242424;color:#fff;font-size:15px';e.textContent='• '+t+' — '+d;b.appendChild(e);b.style.color='#fff';b.style.padding='16px 18px';b.style.textAlign='right'}</script></body></html>
