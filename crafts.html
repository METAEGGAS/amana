<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>صفحتي</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#2b0a4a;min-height:100vh}.w{max-width:360px;margin:0 auto}.hd{position:relative;background:#3d0f66;border-radius:0 0 26px 26px;padding:14px 12px 0}.hero img{display:block;width:82%;max-width:270px;margin:0 auto}.row{display:flex;direction:ltr;gap:8px;padding:5px 12px 0}.row button{flex:1;background:#fff;border:none;border-radius:14px;padding:12px 3px;font-size:13px;font-weight:700;color:#0d0d0d;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.15s}.row button:active{transform:scale(.97);background:#ececec}.cd{background:#3d0f66;border-radius:20px;margin:12px;padding:14px}.cl{width:100%;background:#c8f31d;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;color:#0d0d0d;cursor:pointer;transition:.15s}.cl:active{transform:scale(.98);background:#b4dc12}.inv{margin-top:10px;display:none;gap:8px;direction:rtl}.inv.on{display:flex}.inv input{flex:1;background:#2b0a4a;border:1px solid #7a3ec8;border-radius:12px;padding:12px;color:#fff;font-size:14px;outline:none;text-align:center}.inv button{background:#c8f31d;border:none;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer;font-size:14px}.log{padding:5px 12px 24px}.log h3{font-size:13px;color:#d0b3ff;margin:6px 0 6px}.lb{background:#3d0f66;border-radius:14px;padding:22px 14px;text-align:center;color:#b090d0;font-size:13px;margin-bottom:8px}.drop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #5a2a8a;color:#fff;font-size:13px}.drop .info{display:flex;flex-direction:column;gap:3px}.drop .info b{color:#c8f31d;font-weight:800}.drop .info span{color:#d0b3ff;font-size:11px}.drop button{background:#c8f31d;border:none;border-radius:9px;padding:6px 12px;font-weight:800;color:#0d0d0d;cursor:pointer;font-size:12px}.drop button:active{transform:scale(.95)}#drp{position:fixed;inset:0;background:#2b0a4a;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}#drp.on{display:flex}#drp img{width:170px;height:170px;object-fit:contain;position:relative;z-index:3;filter:drop-shadow(0 0 25px #c8f31d)}#drp .cls{position:absolute;top:18px;left:18px;background:#3d0f66;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;z-index:5}.sm{position:absolute;bottom:-40px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(200,243,29,.55),rgba(122,62,200,.35) 60%,transparent 75%);filter:blur(6px);opacity:0;animation:sm 3.2s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:.9}100%{transform:translateY(120vh) scale(1.6);opacity:0}}</style></head><body><div class="w"><div class="hd"><div class="hero"><img src="https://i.ibb.co/Y4Wq6Pzx/IMG.png" alt="أيقونة"></div></div><div class="row"><button onclick="addLog(1,'العمليات')">★ العمليات</button><button onclick="addLog(2,'ارسال دروب')">👤 ارسال دروب</button><button onclick="addDrop()">🎁 دروب</button></div><div class="cd"><button class="cl" onclick="toggleInv()">استدعاء</button><div class="inv" id="inv"><input id="code" placeholder="ادخل رمز الاستدعاء" /><button onclick="submitCode()">دخول</button></div></div><div class="log"><h3>سجل العمليات</h3><div class="lb" id="lb1">نو داتا</div><h3>سجل ارسال الدروب</h3><div class="lb" id="lb2">نو داتا</div><h3>سجل الدروب</h3><div class="lb" id="lb3">نو داتا</div></div></div><div id="drp"><button class="cls" onclick="closeDrp()">✕</button><img src="https://i.ibb.co/Y4Wq6Pzx/IMG.png" alt="دروب"><div id="smoke"></div></div><script>function ready(b){if(b.textContent==='نو داتا'){b.innerHTML='';b.style.padding='12px 14px';b.style.textAlign='right';b.style.color='#fff'}}function addLog(id,t){var b=document.getElementById('lb'+id);ready(b);var d=new Date().toLocaleTimeString('ar');var e=document.createElement('div');e.style.cssText='padding:8px 0;border-bottom:1px solid #5a2a8a;color:#fff;font-size:13px';e.textContent='• '+t+' — '+d;b.appendChild(e)}function addDrop(){var b=document.getElementById('lb3');ready(b);var d=new Date().toLocaleTimeString('ar');var n=Math.floor(Math.random()*9000)+1000;var e=document.createElement('div');e.className='drop';e.innerHTML='<div class="info"><b>+ '+n.toLocaleString()+' $LOON</b><span>صفقة دروب فعلي — '+d+'</span></div><button onclick="claim(this)">انزال</button>';b.appendChild(e)}function claim(btn){btn.textContent='تم';btn.style.background='#5a2a8a';btn.style.color='#fff';btn.disabled=true;addLog(3,'تم انزال الدروب بنجاح')}function toggleInv(){document.getElementById('inv').classList.toggle('on')}function submitCode(){var v=document.getElementById('code').value.trim();if(!v)return;openDrp()}function openDrp(){var d=document.getElementById('drp');d.classList.add('on');var s=document.getElementById('smoke');s.innerHTML='';for(var i=0;i<10;i++){var p=document.createElement('div');p.className='sm';p.style.left=(10+i*8)+'%';p.style.animationDelay=(i*0.3)+'s';s.appendChild(p)}}function closeDrp(){document.getElementById('drp').classList.remove('on')}</script></body></html>
