function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderMessagesGrouped(msgs){const c=document.getElementById('messagesContainer');if(!msgs||msgs.length===0){c.innerHTML='<div class="empty"><div class="icon">💬</div><div>لا توجد رسائل</div></div>';return}const map={};msgs.forEach(m=>{const uid=gf(m,'userId','uid')||'unknown';if(!map[uid])map[uid]={items:[],last:0,unread:0,name:null,phone:null,email:null};map[uid].items.push(m);const ms=toMs(gf(m,'createdAt','created_at','date','timestamp'));if(ms>map[uid].last)map[uid].last=ms;if(!gf(m,'isRead','read')&&gf(m,'sender','from')==='user')map[uid].unread++;if(!map[uid].name)map[uid].name=gf(m,'userName','name','senderName');if(!map[uid].phone)map[uid].phone=gf(m,'userPhone','phone');if(!map[uid].email)map[uid].email=gf(m,'userEmail','email')});const list=Object.entries(map).sort((a,b)=>b[1].last-a[1].last);let h=`<table><thead><tr><th>#</th><th>المستخدم</th><th>البريد</th><th>الهاتف</th><th>عدد الرسائل</th><th>غير مقروء</th><th>آخر رسالة</th><th>آخر نشاط</th><th>محادثة</th></tr></thead><tbody>`;list.forEach(([uid,g],i)=>{const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const name=g.name||(u?(gf(u,'name','displayName','username','fullName','nickname')||uid):uid);const email=g.email||(u?getEmail(u):'—');const phone=g.phone||(u?(gf(u,'phone','phoneNumber','mobile')||'—'):'—');const last=g.items.sort((a,b)=>toMs(gf(b,'createdAt'))-toMs(gf(a,'createdAt')))[0];const lastText=gf(last,'text','message','content')||'—';h+=`<tr style="cursor:pointer" onclick="openChat('support','${esc(uid)}')"><td>${i+1}</td><td><strong>${esc(name)}</strong></td><td style="font-size:10px;color:#60a5fa">${email==='—'?'—':esc(email)}</td><td>${esc(phone)}</td><td style="text-align:center"><span class="badge badge-user">${g.items.length}</span></td><td style="text-align:center">${g.unread>0?'<span class="badge badge-pending">'+g.unread+'</span>':'<span style="color:#4ade80">✓</span>'}</td><td style="font-size:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(String(lastText).substring(0,55))}</td><td style="font-size:9px;color:#94a3b8">${fmtDate(g.last)}</td><td><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openChat('support','${esc(uid)}')"><i class="fas fa-comments"></i> فتح</button></td></tr>`});h+='</tbody></table>';c.innerHTML=h}

function renderPrograms(){const c=document.getElementById('programsContainer');let h='<div style="padding:14px">';h+='<div style="margin-bottom:10px;color:#94a3b8;font-size:12px">📋 برامج الاستثمار (ثابتة في الكود):</div>';PROGRAMS.forEach((p,idx)=>{h+=`<div class="prog-card"><div><div class="prog-name">${idx+1}. ${esc(p.nameAr)}</div><div style="font-size:10px;color:#64748b;margin-top:2px">${esc(p.nameEn)} · ID: <code style="color:#f97316">${esc(p.id)}</code></div></div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="prog-cost">$${p.cost}</span><span style="font-size:11px;color:#22c55e">+$${p.dailyProfit}/يوم</span><span style="font-size:10px;color:#94a3b8">${p.duration} يوم</span><span style="font-size:10px;color:#a78bfa">${p.percent}</span></div></div>`});h+='<div style="margin-top:14px;padding:10px;background:rgba(249,115,22,.05);border-radius:7px;font-size:11px;color:#94a3b8">💡 معرف البرنامج يُخزّن في <code style="color:#f97316">activePrograms</code> داخل وثيقة المستخدم.</div>';h+='</div>';c.innerHTML=h}

/* ===== CHAT (WhatsApp-like) ===== */
function openChat(type,userId,keepScroll){chatCtx={type,userId};const u=allUsers.find(x=>x.id===userId||gf(x,'uid')===userId);const items=(type==='support'?allMessages:allNotifications).filter(x=>{const id=gf(x,'userId','uid');return id===userId});items.sort((a,b)=>toMs(gf(a,'createdAt','created_at','date','timestamp'))-toMs(gf(b,'createdAt','created_at','date','timestamp')));
let name='مستخدم',email='—',phone='—';if(u){name=gf(u,'name','displayName','username','fullName','nickname')||userId;email=getEmail(u);phone=gf(u,'phone','phoneNumber','mobile')||'—'}else if(type==='support'&&items.length){name=gf(items[0],'userName','name')||userId;phone=gf(items[0],'userPhone','phone')||'—';email=gf(items[0],'userEmail','email')||'—'}
document.getElementById('chatName').textContent=name;document.getElementById('chatMeta').textContent=`${email} · ${phone}`;document.getElementById('chatAvatar').textContent=(name||'?').charAt(0).toUpperCase();
document.getElementById('chatToolbar').innerHTML=`<span><b>UID:</b> <code style="direction:ltr">${esc(String(userId).substring(0,20))}${String(userId).length>20?'…':''}</code></span><span>·</span><span><b>${type==='support'?'💬 دعم':'🔔 إشعارات'}</b></span><span>·</span><span><b>${items.length}</b> عنصر</span>`;
const body=document.getElementById('chatBody');const prevScroll=body.scrollTop;const wasBottom=body.scrollHeight-body.scrollTop-body.clientHeight<50;
if(items.length===0){body.innerHTML='<div class="chat-empty">💭 لا توجد رسائل بعد</div>'}else{let h='',lastDay='';items.forEach(m=>{const ts=gf(m,'createdAt','created_at','date','timestamp');const day=fmtDay(ts);if(day&&day!==lastDay){h+=`<div class="chat-date-sep">${day}</div>`;lastDay=day}const sender=gf(m,'sender','from')||(type==='notifications'?'admin':'user');const isAdmin=sender==='admin'||sender==='manager'||sender==='system';const text=type==='support'?(gf(m,'text','message','content')||''):((gf(m,'title')?'📌 '+gf(m,'title')+'\n':'')+(gf(m,'message','content','body')||''));const read=gf(m,'isRead','read');h+=`<div class="msg ${isAdmin?'msg-admin':'msg-user'}"><div>${esc(text).replace(/\n/g,'<br>')}</div><div class="meta"><span>${fmtTime(ts)} ${isAdmin?'· '+esc(sender):''} ${read?'✓✓':''}</span><button class="msg-del" onclick="deleteMsg('${type==='support'?'support_messages':'notifications'}','${m.id}')" title="حذف"><i class="fas fa-trash"></i></button></div></div>`});body.innerHTML=h}
document.getElementById('chatModal').style.display='block';if(keepScroll&&!wasBottom){body.scrollTop=prevScroll}else{setTimeout(()=>{body.scrollTop=body.scrollHeight},50)}
/* mark unread as read (for support user-sent msgs) */
if(type==='support'){items.forEach(m=>{if(!gf(m,'isRead','read')&&(gf(m,'sender','from')==='user')){db.collection('support_messages').doc(m.id).update({isRead:true}).catch(()=>{})}});}else{items.forEach(m=>{if(!gf(m,'isRead','read')){db.collection('notifications').doc(m.id).update({isRead:true}).catch(()=>{})}})}}

function closeChat(){document.getElementById('chatModal').style.display='none';chatCtx=null}

async function sendChatMsg(){if(!chatCtx)return;const box=document.getElementById('chatInputBox');const text=box.value.trim();if(!text){showToast('⚠️ اكتب رسالة','error');return}const btn=document.getElementById('chatSendBtn');btn.disabled=true;try{const u=allUsers.find(x=>x.id===chatCtx.userId||gf(x,'uid')===chatCtx.userId);const uName=u?(gf(u,'name','displayName','username','fullName','nickname')||chatCtx.userId):chatCtx.userId;const uPhone=u?(gf(u,'phone','phoneNumber','mobile')||''):'';const uEmail=u?getEmail(u):'';if(chatCtx.type==='support'){const doc={userId:chatCtx.userId,userName:uName,userPhone:uPhone,userEmail:uEmail,text,sender:'admin',isRead:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('support_messages').add(doc);allMessages.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}})}else{const doc={userId:chatCtx.userId,title:'رسالة من الإدارة',message:text,type:'admin',isRead:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection('notifications').add(doc);allNotifications.push({id:ref.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}})}box.value='';box.style.height='38px';showToast('✅ تم الإرسال','success');openChat(chatCtx.type,chatCtx.userId);if(chatCtx.type==='support'){fM=allMessages;renderMessagesGrouped(fM)}else{fN=allNotifications;renderNotificationsGrouped(fN)}updateStats()}catch(e){showToast('❌ '+e.message,'error')}btn.disabled=false}

async function deleteMsg(col,id){if(!confirm('حذف هذه الرسالة نهائياً؟'))return;try{await db.collection(col).doc(id).delete();if(col==='support_messages'){allMessages=allMessages.filter(m=>m.id!==id);fM=allMessages;renderMessagesGrouped(fM)}else{allNotifications=allNotifications.filter(n=>n.id!==id);fN=allNotifications;renderNotificationsGrouped(fN)}if(chatCtx)openChat(chatCtx.type,chatCtx.userId);updateStats();showToast('🗑️ حُذفت','success')}catch(e){showToast('❌ '+e.message,'error')}}

async function deleteAllChat(){if(!chatCtx)return;if(!confirm('حذف كل الرسائل في هذه المحادثة؟ لا يمكن التراجع.'))return;const col=chatCtx.type==='support'?'support_messages':'notifications';const arr=chatCtx.type==='support'?allMessages:allNotifications;const items=arr.filter(x=>gf(x,'userId','uid')===chatCtx.userId);try{const batch=db.batch();items.forEach(x=>batch.delete(db.collection(col).doc(x.id)));await batch.commit();if(chatCtx.type==='support'){allMessages=allMessages.filter(m=>gf(m,'userId','uid')!==chatCtx.userId);fM=allMessages;renderMessagesGrouped(fM)}else{allNotifications=allNotifications.filter(n=>gf(n,'userId','uid')!==chatCtx.userId);fN=allNotifications;renderNotificationsGrouped(fN)}openChat(chatCtx.type,chatCtx.userId);updateStats();showToast(`🗑️ حُذف ${items.length}`,'success')}catch(e){showToast('❌ '+e.message,'error')}}

/* ===== User details modal ===== */
function showUserDetails(docId){const u=allUsers.find(x=>x.id===docId||(x.uid&&x.uid===docId));if(!u){showToast('❌ غير موجود','error');return}const name=gf(u,'name','displayName','username','fullName','nickname')||docId;const email=getEmail(u);const phone=gf(u,'phone','phoneNumber','mobile')||'—';document.getElementById('modalTitle').textContent=`👤 ${name} — ${email} — ${phone}`;
let h=`<div class="modal-section"><div class="modal-section-title"><span>📋 الحقول (${Object.keys(u).length})</span><button class="copy-btn" onclick="copyJSON('users','${docId}')"><i class="fas fa-copy"></i> نسخ</button></div>`;const known=['uid','id','name','displayName','username','fullName','nickname','email','emailAddress','mail','phone','phoneNumber','mobile','role','level','balance','wallet','invested','profit','referralProfit','verified','isBlocked','isDeleted','avatar','photoURL','depositAddress','walletIndex','plainPassword','passwordHash','referredBy','activePrograms','lastMiningStartTime','customTotalDeposits','customTotalWithdrawn','createdAt','created_at','registeredAt','joinDate','dateCreated','settings','preferences','fcmToken','pushToken','notifications'];const keys=Object.keys(u);const sorted=known.filter(k=>keys.includes(k)).concat(keys.filter(k=>!known.includes(k)));sorted.forEach(k=>{h+=`<div class="modal-field"><div class="modal-field-k">${esc(k)}</div><div class="modal-field-v">${rv(u[k])}</div></div>`});h+='</div>';
const uid=gf(u,'uid','id');const uDeps=allDeposits.filter(d=>{const did=gf(d,'userId','uid');return did&&(did===uid||did===u.id)});if(uDeps.length>0){h+=`<div class="modal-section"><div class="modal-section-title">📥 إيداعات (${uDeps.length})</div><table class="modal-sub-table"><thead><tr><th>amount</th><th>status</th><th>address</th><th>createdAt</th></tr></thead><tbody>`;uDeps.forEach(d=>{const st=gf(d,'status')||'pending';const sc=st==='pending'?'badge-pending':st==='credited'?'badge-credited':st==='completed'?'badge-completed':st==='failed'?'badge-failed':'';h+=`<tr><td style="color:#f97316">$${gf(d,'amount')||0}</td><td><span class="badge ${sc}">${esc(st)}</span></td><td style="font-size:9px">${esc(String(gf(d,'depositAddress')||'—').substring(0,20))}</td><td style="font-size:9px">${fmtDate(gf(d,'createdAt'))}</td></tr>`});h+='</tbody></table></div>'}
const uTxs=allTransactions.filter(t=>{const tid=gf(t,'userId','uid');return tid&&(tid===uid||tid===u.id)});if(uTxs.length>0){h+=`<div class="modal-section"><div class="modal-section-title">💱 معاملات (${uTxs.length})</div><table class="modal-sub-table"><thead><tr><th>type</th><th>amount</th><th>status</th><th>createdAt</th></tr></thead><tbody>`;uTxs.forEach(t=>{const st=gf(t,'status')||'pending';const sc=st==='pending'?'badge-pending':st==='completed'?'badge-completed':st==='failed'?'badge-failed':'';const tp=gf(t,'type')||'deposit';const tc=tp==='withdrawal'?'badge-withdrawal':'badge-deposit';h+=`<tr><td><span class="badge ${tc}">${esc(tp)}</span></td><td style="color:#f97316">$${gf(t,'amount')||0}</td><td><span class="badge ${sc}">${esc(st)}</span></td><td style="font-size:9px">${fmtDate(gf(t,'createdAt'))}</td></tr>`});h+='</tbody></table></div>'}
h+=`<div class="modal-section" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="closeModal();openChat('support','${esc(uid||u.id)}')"><i class="fas fa-comment"></i> فتح محادثة الدعم</button><button class="btn btn-primary btn-sm" onclick="closeModal();openChat('notifications','${esc(uid||u.id)}')"><i class="fas fa-bell"></i> فتح الإشعارات</button></div>`;
h+=`<div class="modal-section"><div class="modal-section-title">🔧 JSON</div><div class="modal-raw">${esc(JSON.stringify(u,null,2))}</div></div>`;document.getElementById('modalContent').innerHTML=h;document.getElementById('userModal').style.display='block'}

function showDocDetails(type,id){const arr=type==='deposits'?allDeposits:type==='transactions'?allTransactions:type==='broadcasts'?allBroadcasts:type==='notifications'?allNotifications:allMessages;const doc=arr.find(d=>d.id===id);if(!doc){showToast('❌ غير موجود','error');return}const titles={deposits:'📥 إيداع',transactions:'💱 معاملة',broadcasts:'📢 إذاعة',notifications:'🔔 إشعار',support_messages:'💬 رسالة'};document.getElementById('modalTitle').textContent=titles[type]||'التفاصيل';const keys=Object.keys(doc);let h=`<div class="modal-section"><div class="modal-section-title"><span>📋 الحقول (${keys.length})</span><button class="copy-btn" onclick="copyJSON('${type}','${id}')"><i class="fas fa-copy"></i> نسخ</button></div>`;keys.forEach(k=>{h+=`<div class="modal-field"><div class="modal-field-k">${esc(k)}</div><div class="modal-field-v">${rv(doc[k])}</div></div>`});h+=`</div><div class="modal-section"><div class="modal-section-title">🔧 JSON</div><div class="modal-raw">${esc(JSON.stringify(doc,null,2))}</div></div>`;document.getElementById('modalContent').innerHTML=h;document.getElementById('userModal').style.display='block'}
function closeModal(){document.getElementById('userModal').style.display='none'}
function copyJSON(type,id){const arr=type==='users'?allUsers:type==='deposits'?allDeposits:type==='transactions'?allTransactions:type==='broadcasts'?allBroadcasts:type==='notifications'?allNotifications:allMessages;const doc=arr.find(d=>d.id===id);if(doc)navigator.clipboard.writeText(JSON.stringify(doc,null,2)).then(()=>showToast('✅ نُسخ','success')).catch(()=>showToast('❌ فشل','error'))}

function filterUsers(){const q=document.getElementById('userSearch').value.toLowerCase().trim();fU=!q?allUsers:allUsers.filter(u=>JSON.stringify(u).toLowerCase().includes(q));renderUsers(fU)}
function filterDeposits(){const q=document.getElementById('depSearch').value.toLowerCase().trim();fD=!q?allDeposits:allDeposits.filter(d=>{const uid=gf(d,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(d)+em).toLowerCase().includes(q)});renderDeposits(fD)}
function filterTransactions(){const q=document.getElementById('txSearch').value.toLowerCase().trim();fT=!q?allTransactions:allTransactions.filter(t=>{const uid=gf(t,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(t)+em).toLowerCase().includes(q)});renderTransactions(fT)}
function filterWithdrawals(){const q=document.getElementById('wdSearch').value.toLowerCase().trim();fW=!q?allWithdrawals:allWithdrawals.filter(w=>{const uid=gf(w,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(w)+em).toLowerCase().includes(q)});renderWithdrawals(fW)}
function filterBroadcasts(){const q=document.getElementById('bcSearch').value.toLowerCase().trim();fB=!q?allBroadcasts:allBroadcasts.filter(b=>JSON.stringify(b).toLowerCase().includes(q));renderBroadcasts(fB)}
function filterNotifications(){const q=document.getElementById('ntSearch').value.toLowerCase().trim();fN=!q?allNotifications:allNotifications.filter(n=>{const uid=gf(n,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';const nm=u?(gf(u,'name','displayName')||''):'';return(JSON.stringify(n)+em+nm).toLowerCase().includes(q)});renderNotificationsGrouped(fN)}
function filterMessages(){const q=document.getElementById('msgSearch').value.toLowerCase().trim();fM=!q?allMessages:allMessages.filter(m=>{const uid=gf(m,'userId','uid');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);const em=u?getEmail(u):'';return(JSON.stringify(m)+em).toLowerCase().includes(q)});renderMessagesGrouped(fM)}

function updateStats(){document.getElementById('totalUsers').textContent=allUsers.length;document.getElementById('totalDeposits').textContent=allDeposits.length;document.getElementById('totalWithdrawals').textContent=allWithdrawals.length;document.getElementById('totalAdmins').textContent=allUsers.filter(u=>gf(u,'role')==='admin').length;document.getElementById('pendingDeposits').textContent=allDeposits.filter(d=>(gf(d,'status')||'pending')==='pending').length;document.getElementById('pendingWithdrawals').textContent=allWithdrawals.filter(w=>(gf(w,'status')||'pending')==='pending').length;const tb=allUsers.reduce((s,u)=>s+Number(gf(u,'balance','wallet')||0),0);document.getElementById('totalBalance').textContent='$'+tb.toFixed(2);const ti=allUsers.reduce((s,u)=>s+Number(gf(u,'invested','totalInvested')||0),0);document.getElementById('totalInvested').textContent='$'+ti.toFixed(2);const tp=allUsers.reduce((s,u)=>s+Number(gf(u,'profit','earnings')||0),0);document.getElementById('totalProfit').textContent='$'+tp.toFixed(2);document.getElementById('totalBroadcasts').textContent=allBroadcasts.length;document.getElementById('totalNotifications').textContent=allNotifications.length;document.getElementById('totalMessages').textContent=allMessages.length}

async function makeAdmin(docId){if(!docId){showToast('❌ معرّف غير صالح','error');return}try{await db.collection('users').doc(docId).update({role:'admin'});showToast('✅ تمت الترقية','success');loadAllData()}catch(e){showToast(`❌ ${e.message}`,'error')}}

function exportCSV(){if(allUsers.length===0&&allDeposits.length===0){showToast('⚠️ لا توجد بيانات','error');return}let c="=== المستخدمين ===\nuid,name,email,phone,role,level,balance,invested,profit,referralProfit,verified,isBlocked,depositAddress,walletIndex,plainPassword,referredBy,activePrograms,createdAt\n";allUsers.forEach(u=>{c+=[gf(u,'uid','id')||'',gf(u,'name','displayName')||'',getEmail(u),gf(u,'phone','phoneNumber')||'',gf(u,'role')||'',gf(u,'level')||'',gf(u,'balance','wallet')||0,gf(u,'invested')||0,gf(u,'profit')||0,gf(u,'referralProfit')||0,gf(u,'verified')||'',gf(u,'isBlocked')||'',gf(u,'depositAddress')||'',gf(u,'walletIndex')||'',gf(u,'plainPassword')||'',gf(u,'referredBy')||'',Array.isArray(gf(u,'activePrograms'))?gf(u,'activePrograms').join(';'):gf(u,'activePrograms')||'',fmtDate(gf(u,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== الإيداعات ===\nid,userId,email,depositAddress,amount,status,txHash,createdAt\n";allDeposits.forEach(d=>{const uid=gf(d,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[d.id,uid||'',u?getEmail(u):'',gf(d,'depositAddress')||'',gf(d,'amount')||0,gf(d,'status')||'',gf(d,'transactionHash')||'',fmtDate(gf(d,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== المعاملات ===\nid,userId,email,amount,type,status,txHash,createdAt\n";allTransactions.forEach(t=>{const uid=gf(t,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[t.id,uid||'',u?getEmail(u):'',gf(t,'amount')||0,gf(t,'type')||'',gf(t,'status')||'',gf(t,'transactionHash')||'',fmtDate(gf(t,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== الإذاعات ===\nid,title,message,createdBy,createdAt\n";allBroadcasts.forEach(b=>{c+=[b.id,gf(b,'title')||'',gf(b,'message')||'',gf(b,'createdBy')||'',fmtDate(gf(b,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== الإشعارات ===\nid,userId,email,title,message,type,isRead,createdAt\n";allNotifications.forEach(n=>{const uid=gf(n,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[n.id,uid||'',u?getEmail(u):'',gf(n,'title')||'',gf(n,'message')||'',gf(n,'type')||'',gf(n,'isRead')||'',fmtDate(gf(n,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
c+="\n=== رسائل الدعم ===\nid,userId,userName,email,phone,text,sender,isRead,createdAt\n";allMessages.forEach(m=>{const uid=gf(m,'userId');const u=allUsers.find(x=>x.id===uid||gf(x,'uid')===uid);c+=[m.id,uid||'',gf(m,'userName')||'',u?getEmail(u):(gf(m,'userEmail')||''),gf(m,'userPhone')||'',gf(m,'text')||'',gf(m,'sender')||'',gf(m,'isRead')||'',fmtDate(gf(m,'createdAt'))].map(v=>String(v).replace(/,/g,';').replace(/\n/g,' ')).join(',')+'\n'});
const blob=new Blob(["\ufeff"+c],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`nexora_full_${new Date().toISOString().slice(0,10)}.csv`;link.click();showToast('✅ تم التصدير','success')}

function refreshAll(){loadAllData()}
function toggleRaw(){const el=document.getElementById('rawOutput');el.style.display=el.style.display==='none'?'block':'none'}
window.onload=function(){loadAllData()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeChat()}});
</script></body></html>
